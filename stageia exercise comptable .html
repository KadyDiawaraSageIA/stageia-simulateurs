            {id:28,cat:"Gestion Financière",titre:"Levier Financier",desc:"Effet endettement",enonce:"Résultat exploitation 5M, Dettes 20M, Taux 5%, Capitaux 30M.",donnees:[{"element": "Résultat exploitation", "valeur": "5M"}, {"element": "Dettes", "valeur": "20M"}, {"element": "Taux intérêt", "valeur": "5%"}, {"element": "Capitaux propres", "valeur": "30M"}],questions:[{"num": 1, "text": "Charges intérêt=?", "reponseCorrecte": "1000000", "type": "number"}, {"num": 2, "text": "Résultat net=?", "reponseCorrecte": "4000000", "type": "number"}, {"num": 3, "text": "ROE%=?", "reponseCorrecte": "13.33", "type": "number"}, {"num": 4, "text": "ROA%=?", "reponseCorrecte": "10", "type": "number"}, {"num": 5, "text": "Levier positif?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - LEVIER FINANCIER</div><div class='directive-box'>Le levier financier mesure l'impact de l'endettement sur la rentabilité des capitaux propres. Si le coût de la dette (taux d'intérêt) est inférieur à la rentabilité économique de l'entreprise, l'endettement amplifie le ROE : c'est un levier positif, favorable aux actionnaires.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Charges d'intérêt = Dettes × Taux d'intérêt<br>Résultat net = Résultat d'exploitation - Charges d'intérêt<br>ROE = (Résultat net / Capitaux propres) × 100<br>ROA = (Résultat net / Actif total) × 100, avec Actif total = Dettes + Capitaux propres</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : Charges d'intérêt</strong><br>20M × 5% = 1,000,000 CFA<br><br><strong>ÉTAPE 2 : Résultat net</strong><br>5M - 1M = 4,000,000 CFA<br><br><strong>ÉTAPE 3 : ROE</strong><br>(4M / 30M) × 100 = 13.33%<br><br><strong>ÉTAPE 4 : ROA</strong><br>Actif total = 20M + 30M = 50M<br>(4M / 50M) × 100 = 10%</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Résultat d'exploitation: 5,000,000<br>- Charges d'intérêt: (1,000,000)<br>= Résultat net: 4,000,000<br>ROE: 13.33% | ROA: 10%</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Le ROE (13.33%) est supérieur au ROA (10%) : l'endettement joue en faveur des actionnaires, car le taux d'intérêt payé (5%) est inférieur à la rentabilité économique de l'actif (10%). C'est un effet de levier financier positif — emprunter à ce taux est avantageux pour l'entreprise.</div></div>"},
            {id:29,cat:"Gestion Financière",titre:"VAN",desc:"Valeur actuelle nette",enonce:"Investissement 10M, Flux 3M/an pendant 5 ans, Taux 10%.",donnees:[{"element": "Investissement", "valeur": "10M"}, {"element": "Flux annuels", "valeur": "3M"}, {"element": "Durée", "valeur": "5 ans"}, {"element": "Taux", "valeur": "10%"}],questions:[{"num": 1, "text": "Flux total non actualisé=?", "reponseCorrecte": "15000000", "type": "number"}, {"num": 2, "text": "Flux actualisé an 1≈?", "reponseCorrecte": "2727272.73", "type": "number"}, {"num": 3, "text": "VAN approx=?", "reponseCorrecte": "1372000", "type": "number"}, {"num": 4, "text": "Rentable VAN>0?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}, {"num": 5, "text": "Délai récupération≈?", "reponseCorrecte": "3.33", "type": "number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - VALEUR ACTUELLE NETTE (VAN)</div><div class='directive-box'>La VAN actualise les flux de trésorerie futurs d'un projet au taux d'actualisation (coût du capital), puis soustrait l'investissement initial. Une VAN positive signifie que le projet crée de la valeur au-delà de la rentabilité minimale exigée (le taux d'actualisation).</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Flux actualisé année n = Flux / (1 + taux)^n<br>VAN = Somme des flux actualisés - Investissement initial<br>Délai de récupération simple ≈ Investissement / Flux annuel</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>Flux non actualisé total :</strong> 3M × 5 = 15,000,000 CFA<br><br><strong>Flux actualisé année 1 :</strong> 3M / (1.10)¹ = 2,727,272.73 CFA<br>(et ainsi de suite pour les années 2 à 5, avec un facteur d'actualisation décroissant)<br><br><strong>Somme des flux actualisés ≈</strong> 11,372,000 CFA<br><strong>VAN ≈</strong> 11,372,000 - 10,000,000 = 1,372,000 CFA<br><br><strong>Délai de récupération simple :</strong> 10M / 3M ≈ 3.33 ans</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Investissement: (10,000,000)<br>Flux actualisés cumulés (5 ans, taux 10%): ≈ 11,372,000<br>VAN: ≈ 1,372,000 (positive)</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>La VAN positive (≈1.37M) indique que le projet rapporte davantage que le taux de rentabilité minimum exigé de 10% : il crée de la valeur et devrait être accepté. Le délai de récupération simple de 3.33 ans donne un repère complémentaire sur la rapidité de retour sur investissement.</div></div>"},
            {id:30,cat:"Gestion Financière",titre:"TRI",desc:"Taux rendement interne",enonce:"Investissement 10M, Flux 3M/an pendant 5 ans. TRI?",donnees:[{"element": "Investissement", "valeur": "10M"}, {"element": "Flux annuels", "valeur": "3M"}, {"element": "Durée", "valeur": "5 ans"}],questions:[{"num": 1, "text": "TRI est taux où VAN=?", "reponseCorrecte": "0", "type": "number"}, {"num": 2, "text": "TRI approx%=?", "reponseCorrecte": "15.24", "type": "number"}, {"num": 3, "text": "Taux=10%, rentable?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}, {"num": 4, "text": "Taux=20%, rentable?", "reponseCorrecte": "Non", "options": ["Oui", "Non"]}, {"num": 5, "text": "TRI>Taux=projet:", "reponseCorrecte": "Rentable", "options": ["Rentable", "Non rentable"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - TAUX DE RENDEMENT INTERNE (TRI)</div><div class='directive-box'>Le TRI est le taux d'actualisation pour lequel la VAN d'un projet devient nulle. Il représente la rentabilité intrinsèque du projet, indépendamment du taux d'actualisation choisi par l'analyste. On compare ensuite le TRI au coût du capital de l'entreprise pour décider.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>TRI = taux r tel que : Somme des flux actualisés à r = Investissement initial (VAN = 0)<br>Règle de décision : si TRI > taux d'actualisation exigé → projet rentable</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'>Pour cet investissement (10M, flux 3M/an sur 5 ans), le calcul itératif (ou par tableur) donne un TRI d'environ 15.24%.<br><br><strong>Test à 10% :</strong> VAN ≈ +1.37M > 0 → rentable à ce taux<br><strong>Test à 20% :</strong> VAN devient négative → non rentable à ce taux<br>Le TRI (15.24%) se situe donc entre les deux, confirmant la cohérence du calcul.</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>TRI calculé: ≈ 15.24%<br>Comparaison à 10% (taux d'actualisation habituel): TRI > 10% → projet accepté<br>Comparaison à 20%: TRI < 20% → projet aurait été refusé à ce taux d'exigence</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Le projet rapporte un rendement intrinsèque de 15.24% par an. Tant que le coût du capital de l'entreprise reste inférieur à ce seuil (par exemple 10%), le projet est rentable et doit être accepté. Si l'entreprise exigeait 20% de rentabilité minimale, ce même projet serait à rejeter.</div></div>"},
            {id:31,cat:"Gestion Financière",titre:"Cycle Trésorerie",desc:"Délai financement",enonce:"Délai fournisseurs 30j, Stockage 45j, Recouvrement 20j.",donnees:[{"element": "Délai fournisseurs", "valeur": "30j"}, {"element": "Délai stockage", "valeur": "45j"}, {"element": "Délai recouvrement", "valeur": "20j"}],questions:[{"num": 1, "text": "Cycle exploitation=?", "reponseCorrecte": "65", "type": "number"}, {"num": 2, "text": "Cycle trésorerie=?", "reponseCorrecte": "35", "type": "number"}, {"num": 3, "text": "Jours à financer=?", "reponseCorrecte": "35", "type": "number"}, {"num": 4, "text": "Cycle positif=besoin?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}, {"num": 5, "text": "Réduire stockage?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - CYCLE DE TRÉSORERIE (CASH CONVERSION CYCLE)</div><div class='directive-box'>Le cycle de trésorerie mesure le nombre de jours pendant lesquels l'entreprise doit financer son exploitation sur ses propres ressources, entre le moment où elle paie ses fournisseurs et celui où elle encaisse ses clients.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Cycle d'exploitation = Délai de stockage + Délai de recouvrement clients<br>Cycle de trésorerie = Cycle d'exploitation - Délai de paiement fournisseurs</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : Cycle d'exploitation</strong><br>45j (stockage) + 20j (recouvrement) = 65 jours<br><br><strong>ÉTAPE 2 : Cycle de trésorerie</strong><br>65j - 30j (fournisseurs) = 35 jours</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Stockage: 45j + Recouvrement: 20j = Cycle exploitation: 65j<br>- Délai fournisseurs: 30j<br>= Cycle de trésorerie (à financer): 35 jours</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>L'entreprise doit financer son cycle d'exploitation pendant 35 jours sur ses fonds propres ou par crédit court terme, car ses fournisseurs (30j) ne couvrent pas la totalité du délai stockage + clients (65j). Réduire le délai de stockage (45j, le poste le plus lourd) est le levier le plus efficace pour raccourcir ce cycle et libérer de la trésorerie.</div></div>"},
            {id:32,cat:"Gestion Financière",titre:"Optimisation Trésorerie",desc:"Gestion excédents",enonce:"Trésorerie 5M, Recettes 20M, Dépenses 22M. Besoin?",donnees:[{"element": "Trésorerie initiale", "valeur": "5M"}, {"element": "Recettes", "valeur": "20M"}, {"element": "Dépenses", "valeur": "22M"}],questions:[{"num": 1, "text": "Flux net=?", "reponseCorrecte": "-2000000", "type": "number"}, {"num": 2, "text": "Trésorerie finale=?", "reponseCorrecte": "3000000", "type": "number"}, {"num": 3, "text": "Besoin financement?", "reponseCorrecte": "Non", "options": ["Oui", "Non"]}, {"num": 4, "text": "Besoin=?", "reponseCorrecte": "0", "type": "number"}, {"num": 5, "text": "Si dépenses=25M, besoin=?", "reponseCorrecte": "0", "type": "number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - GESTION PRÉVISIONNELLE DE TRÉSORERIE</div><div class='directive-box'>Le plan de trésorerie compare les recettes et dépenses prévisionnelles pour anticiper les excédents (à placer) ou les déficits (à financer par découvert ou crédit court terme), en partant du solde de trésorerie initial.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Flux net de la période = Recettes - Dépenses<br>Trésorerie finale = Trésorerie initiale + Flux net<br>Besoin de financement = uniquement si Trésorerie finale < 0</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : Flux net</strong><br>20M - 22M = -2,000,000 CFA<br><br><strong>ÉTAPE 2 : Trésorerie finale</strong><br>5M + (-2M) = 3,000,000 CFA<br><br><strong>ÉTAPE 3 : Besoin de financement</strong><br>Trésorerie finale (3M) > 0 → aucun besoin</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Trésorerie initiale: 5,000,000<br>+ Flux net (Recettes - Dépenses): (2,000,000)<br>= Trésorerie finale: 3,000,000 (positive)<br>Besoin de financement: 0</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Malgré un flux net négatif sur la période (les dépenses dépassent les recettes de 2M), la trésorerie initiale de 5M suffit à absorber ce déficit : l'entreprise termine avec 3M positifs, sans besoin de financement externe. Ce coussin de trésorerie initial a joué son rôle protecteur.</div></div>"},
            {id:33,cat:"Gestion Financière",titre:"CAF",desc:"Capacité autofinancement",enonce:"Résultat net 5M, Amortissements 2M, Provisions 500K, Dividendes 1M.",donnees:[{"element": "Résultat net", "valeur": "5M"}, {"element": "Amortissements", "valeur": "2M"}, {"element": "Provisions", "valeur": "500K"}, {"element": "Dividendes", "valeur": "1M"}],questions:[{"num": 1, "text": "CAF brute=?", "reponseCorrecte": "7500000", "type": "number"}, {"num": 2, "text": "CAF nette=?", "reponseCorrecte": "6500000", "type": "number"}, {"num": 3, "text": "Taux autofinancement%=?", "reponseCorrecte": "130", "type": "number"}, {"num": 4, "text": "Peut financer investissements?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}, {"num": 5, "text": "CAF>Dividendes?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - CAPACITÉ D'AUTOFINANCEMENT (CAF)</div><div class='directive-box'>La CAF mesure les ressources internes générées par l'entreprise, disponibles pour financer ses investissements, rembourser ses dettes ou distribuer des dividendes, sans recourir à un financement externe. Elle part du résultat net et y réintègre les charges non décaissées (amortissements, provisions).</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>CAF brute = Résultat net + Amortissements + Provisions<br>CAF nette (après distribution) = CAF brute - Dividendes<br>Taux d'autofinancement = (CAF brute / Résultat net) × 100</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : CAF brute</strong><br>5M + 2M + 500K = 7,500,000 CFA<br><br><strong>ÉTAPE 2 : CAF nette</strong><br>7.5M - 1M = 6,500,000 CFA<br><br><strong>ÉTAPE 3 : Taux d'autofinancement</strong><br>(7.5M / 5M) × 100 = 130%</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Résultat net: 5,000,000<br>+ Amortissements: 2,000,000<br>+ Provisions: 500,000<br>= CAF brute: 7,500,000<br>- Dividendes: (1,000,000)<br>= CAF nette: 6,500,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>La CAF brute (7.5M) dépasse largement le résultat net comptable (5M) grâce aux charges non décaissées. Après versement des dividendes (1M), il reste 6.5M de ressources internes disponibles pour financer de nouveaux investissements sans emprunt supplémentaire — un signe de bonne santé financière.</div></div>"},
            {id:34,cat:"Comptabilité Analytique",titre:"Coût Complet",desc:"Coût de revient",enonce:"Matière 2M, Main-d'œuvre 1M, Charges indirectes 500K. 100 unités.",donnees:[{"element": "Matière", "valeur": "2M"}, {"element": "Main-d'œuvre", "valeur": "1M"}, {"element": "Charges indirectes", "valeur": "500K"}, {"element": "Quantité", "valeur": "100 unités"}],questions:[{"num": 1, "text": "Coût total=?", "reponseCorrecte": "3500000", "type": "number"}, {"num": 2, "text": "Coût unitaire=?", "reponseCorrecte": "35000", "type": "number"}, {"num": 3, "text": "% Matière=?", "reponseCorrecte": "57.14", "type": "number"}, {"num": 4, "text": "% Main-d'œuvre=?", "reponseCorrecte": "28.57", "type": "number"}, {"num": 5, "text": "% Charges indirectes=?", "reponseCorrecte": "14.29", "type": "number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - MÉTHODE DES COÛTS COMPLETS</div><div class='directive-box'>La méthode des coûts complets affecte l'ensemble des charges (directes et indirectes) à un produit pour déterminer son coût de revient réel. C'est la méthode de référence en comptabilité analytique OHADA pour fixer un prix de vente rentable.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Coût total = Matière + Main-d'œuvre + Charges indirectes<br>Coût unitaire = Coût total / Quantité produite<br>% du poste = (Poste / Coût total) × 100</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : Coût total</strong><br>2M + 1M + 500K = 3,500,000 CFA<br><br><strong>ÉTAPE 2 : Coût unitaire</strong><br>3.5M / 100 = 35,000 CFA/unité<br><br><strong>ÉTAPE 3 : Répartition en %</strong><br>Matière : (2M / 3.5M) × 100 = 57.14%<br>Main-d'œuvre : (1M / 3.5M) × 100 = 28.57%<br>Charges indirectes : (500K / 3.5M) × 100 = 14.29%</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Matière: 2,000,000 (57.14%)<br>Main-d'œuvre: 1,000,000 (28.57%)<br>Charges indirectes: 500,000 (14.29%)<br>COÛT TOTAL: 3,500,000 → Coût unitaire: 35,000 CFA</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>La matière première représente plus de la moitié du coût de revient (57%), ce qui en fait le poste prioritaire pour toute optimisation des coûts (négociation fournisseurs, réduction des pertes matière). Le prix de vente unitaire devra dépasser 35,000 CFA pour être rentable.</div></div>"},
            {id:35,cat:"Comptabilité Analytique",titre:"Coûts Variables/Fixes",desc:"Distinction coûts",enonce:"Coûts var 12M (100 unités), Coûts fixes 5M. Coût total?",donnees:[{"element": "Coûts var", "valeur": "12M"}, {"element": "Coûts fixes", "valeur": "5M"}, {"element": "Quantité", "valeur": "100 unités"}],questions:[{"num": 1, "text": "Coût total=?", "reponseCorrecte": "17000000", "type": "number"}, {"num": 2, "text": "Coût var unitaire=?", "reponseCorrecte": "120000", "type": "number"}, {"num": 3, "text": "Coût fixe unitaire=?", "reponseCorrecte": "50000", "type": "number"}, {"num": 4, "text": "Coût unitaire=?", "reponseCorrecte": "170000", "type": "number"}, {"num": 5, "text": "Si 200 unités, total=?", "reponseCorrecte": "29000000", "type": "number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - DISTINCTION COÛTS VARIABLES / COÛTS FIXES</div><div class='directive-box'>Les coûts variables évoluent proportionnellement au volume produit (matière, main-d'œuvre directe), tandis que les coûts fixes restent constants sur une période, quelle que soit la production (loyer, amortissements). Cette distinction est la base du calcul du seuil de rentabilité.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Coût total = Coûts variables + Coûts fixes<br>Coût variable unitaire = Coûts variables / Quantité<br>Coût fixe unitaire = Coûts fixes / Quantité (diminue si la quantité augmente)</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : Coût total (100 unités)</strong><br>12M + 5M = 17,000,000 CFA<br><br><strong>ÉTAPE 2 : Coût variable unitaire</strong><br>12M / 100 = 120,000 CFA<br><br><strong>ÉTAPE 3 : Coût fixe unitaire</strong><br>5M / 100 = 50,000 CFA<br><br><strong>ÉTAPE 4 : Coût unitaire total</strong><br>120,000 + 50,000 = 170,000 CFA<br><br><strong>ÉTAPE 5 : Si 200 unités</strong><br>Coûts variables = 12M × 2 = 24M (proportionnels)<br>Coûts fixes = 5M (inchangés)<br>Total = 24M + 5M = 29,000,000 CFA</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Pour 100 unités : CV 12,000,000 + CF 5,000,000 = 17,000,000 (170,000/u)<br>Pour 200 unités : CV 24,000,000 + CF 5,000,000 = 29,000,000 (145,000/u)</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>En doublant la production, le coût total n'augmente que de 71% (17M → 29M) et non de 100%, car les charges fixes se répartissent sur davantage d'unités. Le coût unitaire baisse de 170,000 à 145,000 CFA : c'est l'effet d'économie d'échelle, un argument clé pour augmenter les volumes de production.</div></div>"},
            {id:36,cat:"Comptabilité Analytique",titre:"Marge sur CV",desc:"Marge brute",enonce:"Ventes 30M, Coûts var 18M. Marge?",donnees:[{"element": "Ventes", "valeur": "30M"}, {"element": "Coûts var", "valeur": "18M"}],questions:[{"num": 1, "text": "Marge=?", "reponseCorrecte": "12000000", "type": "number"}, {"num": 2, "text": "Taux%=?", "reponseCorrecte": "40", "type": "number"}, {"num": 3, "text": "Si CF=8M, résultat=?", "reponseCorrecte": "4000000", "type": "number"}, {"num": 4, "text": "Couvre CF?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}, {"num": 5, "text": "SR=?", "reponseCorrecte": "20000000", "type": "number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - MARGE SUR COÛTS VARIABLES</div><div class='directive-box'>La marge sur coûts variables (MCV) est la ressource dégagée par les ventes après déduction des seuls coûts variables. Elle sert d'abord à couvrir les charges fixes ; ce qui reste au-delà constitue le résultat. C'est l'outil clé du raisonnement coût-volume-profit.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>MCV = Ventes - Coûts variables<br>Taux de MCV = (MCV / Ventes) × 100<br>Résultat = MCV - Charges fixes<br>Seuil de rentabilité = Charges fixes / Taux de MCV</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : Marge sur coûts variables</strong><br>30M - 18M = 12,000,000 CFA<br><br><strong>ÉTAPE 2 : Taux de MCV</strong><br>(12M / 30M) × 100 = 40%<br><br><strong>ÉTAPE 3 : Résultat si charges fixes = 8M</strong><br>12M - 8M = 4,000,000 CFA<br><br><strong>ÉTAPE 4 : Seuil de rentabilité</strong><br>8M / 40% = 20,000,000 CFA</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Ventes: 30,000,000<br>- Coûts variables: (18,000,000)<br>= MCV: 12,000,000 (40%)<br>- Charges fixes: (8,000,000)<br>= Résultat: 4,000,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Chaque franc de vente dégage 40 centimes de marge sur coûts variables. Cette marge couvre les 8M de charges fixes et laisse 4M de bénéfice. L'entreprise doit vendre au minimum 20M (son seuil de rentabilité) pour atteindre l'équilibre ; au-delà, chaque franc supplémentaire de vente génère 40 centimes de profit net.</div></div>"},
            {id:37,cat:"Comptabilité Analytique",titre:"Analyse ABC",desc:"Classification articles",enonce:"Article A 50% (5M), Article B 30% (3M), Article C 20% (2M).",donnees:[{"article": "A", "valeur": "5M", "pourcentage": "50%"}, {"article": "B", "valeur": "3M", "pourcentage": "30%"}, {"article": "C", "valeur": "2M", "pourcentage": "20%"}],questions:[{"num": 1, "text": "Total stock=?", "reponseCorrecte": "10000000", "type": "number"}, {"num": 2, "text": "Article A classe:", "reponseCorrecte": "Classe A", "options": ["Classe A", "Classe B", "Classe C"]}, {"num": 3, "text": "Classe A%=?", "reponseCorrecte": "50", "type": "number"}, {"num": 4, "text": "A+B%=?", "reponseCorrecte": "80", "type": "number"}, {"num": 5, "text": "Classe A gestion stricte?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - MÉTHODE ABC (LOI DE PARETO)</div><div class='directive-box'>La méthode ABC classe les articles de stock selon leur poids économique : la Classe A (peu d'articles, forte valeur) exige un contrôle rigoureux et fréquent, la Classe B un suivi normal, la Classe C (nombreux articles, faible valeur) une gestion simplifiée. Elle applique la loi de Pareto (20% des articles = 80% de la valeur).</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Total stock = Somme des valeurs par article<br>% du stock = (Valeur de l'article / Total stock) × 100<br>Classe A : environ 70-80% de la valeur ; Classe B : 15-20% ; Classe C : 5-10%</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : Total du stock</strong><br>5M + 3M + 2M = 10,000,000 CFA<br><br><strong>ÉTAPE 2 : Classement</strong><br>Article A (5M) = 50% du stock → Classe A<br>Article B (3M) = 30% du stock → Classe B<br>Article C (2M) = 20% du stock → Classe C<br><br><strong>ÉTAPE 3 : Cumul A+B</strong><br>50% + 30% = 80%</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Article A: 5,000,000 (50%) → Classe A : contrôle strict\nArticle B: 3,000,000 (30%) → Classe B : suivi normal\nArticle C: 2,000,000 (20%) → Classe C : gestion simplifiée\nTOTAL: 10,000,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>L'Article A représente à lui seul 50% de la valeur du stock : il mérite un inventaire fréquent, un suivi précis des entrées/sorties et une négociation fournisseur prioritaire. Les articles A et B cumulés (80% de la valeur) doivent concentrer l'essentiel de l'attention de la gestion des stocks, l'Article C pouvant être géré de façon plus légère.</div></div>"},
            {id:38,cat:"Comptabilité Analytique",titre:"Coût Production",desc:"Coût de production",enonce:"SI MP 3M, Achats 10M, SF 2M, MO 5M, CI 2M.",donnees:[{"element": "Stock initial", "valeur": "3M"}, {"element": "Achats", "valeur": "10M"}, {"element": "Stock final", "valeur": "2M"}, {"element": "MO", "valeur": "5M"}, {"element": "CI", "valeur": "2M"}],questions:[{"num": 1, "text": "MP consommée=?", "reponseCorrecte": "11000000", "type": "number"}, {"num": 2, "text": "Coût production=?", "reponseCorrecte": "18000000", "type": "number"}, {"num": 3, "text": "% MP=?", "reponseCorrecte": "61.11", "type": "number"}, {"num": 4, "text": "% MO=?", "reponseCorrecte": "27.78", "type": "number"}, {"num": 5, "text": "% CI=?", "reponseCorrecte": "11.11", "type": "number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - COÛT DE PRODUCTION</div><div class='directive-box'>Le coût de production regroupe la matière première réellement consommée (et non simplement achetée), la main-d'œuvre directe et les charges indirectes de production. La consommation de matière tient compte du stock initial et du stock final pour ne retenir que ce qui a été réellement utilisé.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Matière première consommée = Stock initial + Achats - Stock final<br>Coût de production = MP consommée + Main-d'œuvre + Charges indirectes</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : MP consommée</strong><br>3M + 10M - 2M = 11,000,000 CFA<br><br><strong>ÉTAPE 2 : Coût de production</strong><br>11M + 5M + 2M = 18,000,000 CFA<br><br><strong>ÉTAPE 3 : Répartition en %</strong><br>MP : (11M / 18M) × 100 = 61.11%<br>MO : (5M / 18M) × 100 = 27.78%<br>CI : (2M / 18M) × 100 = 11.11%</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>MP consommée: 11,000,000 (61.11%)<br>Main-d'œuvre: 5,000,000 (27.78%)<br>Charges indirectes: 2,000,000 (11.11%)<br>COÛT DE PRODUCTION: 18,000,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>La matière première consommée (11M, soit 61% du coût) domine largement le coût de production, devant la main-d'œuvre (28%) et les charges indirectes (11%). Le suivi rigoureux des achats et de la consommation de matière première est donc le principal levier de maîtrise des coûts de production.</div></div>"},
            {id:39,cat:"Comptabilité Analytique",titre:"Coût Revient",desc:"Coût complet",enonce:"Coût production 18M, Distribution 3M, Administratif 2M. 100 unités.",donnees:[{"element": "Coût production", "valeur": "18M"}, {"element": "Distribution", "valeur": "3M"}, {"element": "Administratif", "valeur": "2M"}, {"element": "Quantité", "valeur": "100 unités"}],questions:[{"num": 1, "text": "Coût revient=?", "reponseCorrecte": "23000000", "type": "number"}, {"num": 2, "text": "Unitaire=?", "reponseCorrecte": "230000", "type": "number"}, {"num": 3, "text": "% Distribution=?", "reponseCorrecte": "13.04", "type": "number"}, {"num": 4, "text": "% Administratif=?", "reponseCorrecte": "8.70", "type": "number"}, {"num": 5, "text": "Si PV=250K, marge=?", "reponseCorrecte": "20000", "type": "number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - COÛT DE REVIENT</div><div class='directive-box'>Le coût de revient (ou coût complet) ajoute au coût de production les charges hors production nécessaires pour vendre le produit : distribution (commercialisation, transport) et frais administratifs. C'est le coût de référence pour fixer un prix de vente rentable.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Coût de revient = Coût de production + Frais de distribution + Frais administratifs<br>Coût unitaire = Coût de revient / Quantité<br>Marge unitaire = Prix de vente - Coût de revient unitaire</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : Coût de revient</strong><br>18M + 3M + 2M = 23,000,000 CFA<br><br><strong>ÉTAPE 2 : Coût unitaire</strong><br>23M / 100 = 230,000 CFA<br><br><strong>ÉTAPE 3 : Répartition en %</strong><br>Distribution : (3M / 23M) × 100 = 13.04%<br>Administratif : (2M / 23M) × 100 = 8.70%<br><br><strong>ÉTAPE 4 : Marge si prix de vente = 250,000</strong><br>250,000 - 230,000 = 20,000 CFA/unité</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Coût de production: 18,000,000 (78.26%)<br>Distribution: 3,000,000 (13.04%)<br>Administratif: 2,000,000 (8.70%)<br>COÛT DE REVIENT: 23,000,000 → 230,000 CFA/unité</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Au coût de revient unitaire de 230,000 CFA, un prix de vente de 250,000 CFA ne dégage qu'une marge de 20,000 CFA par unité (8.7% du prix de vente), une marge assez serrée. L'entreprise devrait examiner si les frais de distribution (13%) peuvent être optimisés pour améliorer sa rentabilité.</div></div>"},
            {id:40,cat:"Comptabilité Analytique",titre:"Résultat Analytique",desc:"Résultat par produit",enonce:"Produit A: Ventes 15M, Coût 10M. Produit B: Ventes 20M, Coût 14M.",donnees:[{"produit": "A", "ventes": "15M", "cout": "10M"}, {"produit": "B", "ventes": "20M", "cout": "14M"}],questions:[{"num": 1, "text": "Résultat A=?", "reponseCorrecte": "5000000", "type": "number"}, {"num": 2, "text": "Résultat B=?", "reponseCorrecte": "6000000", "type": "number"}, {"num": 3, "text": "Total=?", "reponseCorrecte": "11000000", "type": "number"}, {"num": 4, "text": "Taux A%=?", "reponseCorrecte": "33.33", "type": "number"}, {"num": 5, "text": "Taux B%=?", "reponseCorrecte": "30", "type": "number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - RÉSULTAT ANALYTIQUE PAR PRODUIT</div><div class='directive-box'>La comptabilité analytique permet de calculer un résultat par produit ou par ligne d'activité, pour identifier les produits les plus rentables et orienter les décisions commerciales (priorisation, abandon de gamme, politique de prix).</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Résultat par produit = Ventes du produit - Coût du produit<br>Taux de rentabilité = (Résultat / Ventes) × 100</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>Produit A :</strong><br>Résultat = 15M - 10M = 5,000,000 CFA<br>Taux = (5M / 15M) × 100 = 33.33%<br><br><strong>Produit B :</strong><br>Résultat = 20M - 14M = 6,000,000 CFA<br>Taux = (6M / 20M) × 100 = 30%<br><br><strong>Total :</strong> 5M + 6M = 11,000,000 CFA</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Produit A: Ventes 15,000,000 - Coût 10,000,000 = Résultat 5,000,000 (33.33%)<br>Produit B: Ventes 20,000,000 - Coût 14,000,000 = Résultat 6,000,000 (30%)<br>RÉSULTAT TOTAL: 11,000,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>En valeur absolue, le Produit B rapporte davantage (6M contre 5M), mais en taux de rentabilité, le Produit A est plus performant (33.33% contre 30%) : il transforme mieux chaque franc de vente en bénéfice. Le choix entre privilégier A ou B dépendra des contraintes de capacité de production de l'entreprise.</div></div>"},
            {id:41,cat:"Comptabilité Analytique",titre:"Imputation Rationnelle",desc:"Ajustement coûts fixes",enonce:"Coûts fixes 8M, Capacité 200 unités, Production 150 unités.",donnees:[{"element": "Coûts fixes", "valeur": "8M"}, {"element": "Capacité", "valeur": "200 unités"}, {"element": "Production", "valeur": "150 unités"}],questions:[{"num": 1, "text": "Coût fixe unitaire normal=?", "reponseCorrecte": "40000", "type": "number"}, {"num": 2, "text": "Taux activité%=?", "reponseCorrecte": "75", "type": "number"}, {"num": 3, "text": "Coût fixe imputé=?", "reponseCorrecte": "6000000", "type": "number"}, {"num": 4, "text": "Différence=?", "reponseCorrecte": "2000000", "type": "number"}, {"num": 5, "text": "Différence négative?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - IMPUTATION RATIONNELLE DES CHARGES FIXES</div><div class='directive-box'>L'imputation rationnelle neutralise l'effet de la sous-activité (ou de la suractivité) sur le coût unitaire, en n'imputant aux produits que la part des charges fixes correspondant au taux d'utilisation réel de la capacité. L'écart (coût de sous-activité ou de suractivité) est isolé séparément.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Coût fixe unitaire normal = Charges fixes / Capacité normale<br>Taux d'activité = (Production réelle / Capacité normale) × 100<br>Coût fixe imputé = Charges fixes × Taux d'activité<br>Différence (coût de sous-activité) = Charges fixes - Coût fixe imputé</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : Coût fixe unitaire normal</strong><br>8M / 200 = 40,000 CFA<br><br><strong>ÉTAPE 2 : Taux d'activité</strong><br>(150 / 200) × 100 = 75%<br><br><strong>ÉTAPE 3 : Coût fixe imputé</strong><br>8M × 75% = 6,000,000 CFA<br><br><strong>ÉTAPE 4 : Différence (coût de sous-activité)</strong><br>8M - 6M = 2,000,000 CFA (charge non absorbée)</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Charges fixes réelles: 8,000,000<br>Coût fixe imputé (à 75% d'activité): 6,000,000<br>Coût de sous-activité (non imputé aux produits): 2,000,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>L'entreprise n'utilise que 75% de sa capacité de production. Les 2M de charges fixes correspondant à la capacité inutilisée (25%) ne doivent pas être imputés au coût des produits — ils sont isolés comme « coût de sous-activité », une perte liée à la sous-utilisation de l'outil de production, à traiter comme un signal d'alerte sur le dimensionnement de l'appareil productif.</div></div>"},
            {id:42,cat:"Comptabilité Analytique",titre:"Écarts",desc:"Écart sur coûts",enonce:"Coût standard 100K/u, Coût réel 110K/u. 100 unités.",donnees:[{"element": "Standard", "valeur": "100K/u"}, {"element": "Réel", "valeur": "110K/u"}, {"element": "Quantité", "valeur": "100 unités"}],questions:[{"num": 1, "text": "Standard total=?", "reponseCorrecte": "10000000", "type": "number"}, {"num": 2, "text": "Réel total=?", "reponseCorrecte": "11000000", "type": "number"}, {"num": 3, "text": "Écart=?", "reponseCorrecte": "1000000", "type": "number"}, {"num": 4, "text": "Défavorable?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}, {"num": 5, "text": "Écart unitaire=?", "reponseCorrecte": "10000", "type": "number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - ANALYSE DES ÉCARTS SUR COÛTS</div><div class='directive-box'>Le contrôle budgétaire compare le coût standard (prévu, normatif) au coût réel constaté, pour dégager un écart. Un écart défavorable (coût réel > coût standard) signale une dérive à analyser (hausse des prix d'achat, gaspillage, baisse de productivité).</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Coût total standard = Coût standard unitaire × Quantité<br>Coût total réel = Coût réel unitaire × Quantité<br>Écart = Coût réel total - Coût standard total<br>Écart défavorable si positif (coût réel supérieur au standard)</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : Coût standard total</strong><br>100,000 × 100 = 10,000,000 CFA<br><br><strong>ÉTAPE 2 : Coût réel total</strong><br>110,000 × 100 = 11,000,000 CFA<br><br><strong>ÉTAPE 3 : Écart global</strong><br>11M - 10M = 1,000,000 CFA (défavorable)<br><br><strong>ÉTAPE 4 : Écart unitaire</strong><br>110,000 - 100,000 = 10,000 CFA/unité</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Coût standard: 10,000,000 (100,000 CFA/u)<br>Coût réel: 11,000,000 (110,000 CFA/u)<br>Écart: +1,000,000 (DÉFAVORABLE, +10%)</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Le coût réel dépasse le standard de 1M sur la production totale (10% de dérive par unité). Cet écart défavorable doit être analysé : est-il dû à une hausse du prix des matières, à une baisse de productivité de la main-d'œuvre, ou à un gaspillage ? Cette analyse guide les actions correctives à mettre en place.</div></div>"},
            {id:43,cat:"Comptabilité Analytique",titre:"SR Quantité",desc:"Point mort en unités",enonce:"Marge unitaire 50K, Charges fixes 5M. Quantité seuil?",donnees:[{"element": "Marge unitaire", "valeur": "50K"}, {"element": "Charges fixes", "valeur": "5M"}],questions:[{"num": 1, "text": "SR quantité=?", "reponseCorrecte": "100", "type": "number"}, {"num": 2, "text": "Si 150 unités, résultat=?", "reponseCorrecte": "2500000", "type": "number"}, {"num": 3, "text": "Marge sécurité=?", "reponseCorrecte": "50", "type": "number"}, {"num": 4, "text": "Indice sécurité%=?", "reponseCorrecte": "33.33", "type": "number"}, {"num": 5, "text": "Au SR, résultat=?", "reponseCorrecte": "0", "type": "number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - SEUIL DE RENTABILITÉ EN QUANTITÉ</div><div class='directive-box'>Le seuil de rentabilité peut s'exprimer en nombre d'unités à vendre (plutôt qu'en chiffre d'affaires) : c'est la quantité pour laquelle la marge unitaire cumulée couvre exactement les charges fixes. Très utile pour piloter des objectifs commerciaux concrets (nombre de ventes à réaliser).</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>SR en quantité = Charges fixes / Marge sur coût variable unitaire<br>Résultat = (Quantité vendue - SR en quantité) × Marge unitaire<br>Marge de sécurité (en unités) = Quantité vendue - SR en quantité</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : SR en quantité</strong><br>5M / 50,000 = 100 unités<br><br><strong>ÉTAPE 2 : Résultat si 150 unités vendues</strong><br>(150 - 100) × 50,000 = 2,500,000 CFA<br><br><strong>ÉTAPE 3 : Marge de sécurité</strong><br>150 - 100 = 50 unités<br><br><strong>ÉTAPE 4 : Indice de sécurité</strong><br>(50 / 150) × 100 = 33.33%</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Seuil de rentabilité: 100 unités<br>Ventes réalisées: 150 unités<br>Marge de sécurité: 50 unités (33.33%)<br>Résultat au seuil: 0 | Résultat à 150 unités: 2,500,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>L'entreprise doit vendre au minimum 100 unités pour atteindre l'équilibre. Avec 150 unités vendues, elle dégage un résultat de 2.5M et dispose d'une marge de sécurité de 50 unités (33%) : ses ventes pourraient chuter d'un tiers avant de repasser en zone de perte.</div></div>"},
            {id:44,cat:"TVA et Fiscalité",titre:"Déclaration TVA",desc:"TVA à déclarer",enonce:"TVA collectée 2.7M, TVA déductible 1.8M. À déclarer?",donnees:[{"element": "TVA collectée", "valeur": "2.7M"}, {"element": "TVA déductible", "valeur": "1.8M"}],questions:[{"num": 1, "text": "TVA à déclarer=?", "reponseCorrecte": "900000", "type": "number"}, {"num": 2, "text": "À payer ou récupérer?", "reponseCorrecte": "À payer", "options": ["À payer", "À récupérer"]}, {"num": 3, "text": "Si déductible=3M, récupérer=?", "reponseCorrecte": "300000", "type": "number"}, {"num": 4, "text": "Charge pour entreprise?", "reponseCorrecte": "Non", "options": ["Oui", "Non"]}, {"num": 5, "text": "Collectée>Déductible=?", "reponseCorrecte": "Versement au Trésor", "options": ["Versement au Trésor", "Remboursement"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - DÉCLARATION MENSUELLE DE TVA</div><div class='directive-box'>Chaque mois, l'entreprise assujettie à la TVA au Mali calcule la différence entre la TVA collectée sur ses ventes et la TVA déductible sur ses achats. Le solde doit être déclaré et reversé (ou récupéré) auprès de la Direction Générale des Impôts (DGI).</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>TVA à déclarer = TVA collectée - TVA déductible<br>Si le résultat est positif → à payer au Trésor<br>Si le résultat est négatif → crédit de TVA à récupérer ou reporter</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>Situation donnée :</strong><br>TVA à déclarer = 2.7M - 1.8M = 900,000 CFA (à payer)<br><br><strong>Variante : si TVA déductible = 3M</strong><br>2.7M - 3M = -300,000 CFA → crédit de TVA de 300,000 CFA à récupérer/reporter</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>TVA collectée (sur ventes): 2,700,000<br>- TVA déductible (sur achats): (1,800,000)<br>= TVA à verser au Trésor: 900,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>L'entreprise a collecté plus de TVA sur ses ventes qu'elle n'en a payé sur ses achats : elle doit reverser la différence (900K) à l'État. La TVA n'est jamais une charge pour l'entreprise assujettie — elle ne fait que collecter cet impôt pour le compte du Trésor et le lui reverser.</div></div>"},
            {id:45,cat:"TVA et Fiscalité",titre:"Impôt Sociétés",desc:"Calcul IS",enonce:"Résultat net 10M, Taux IS 30%. IS à payer?",donnees:[{"element": "Résultat net", "valeur": "10M"}, {"element": "Taux IS", "valeur": "30%"}],questions:[{"num": 1, "text": "IS=?", "reponseCorrecte": "3000000", "type": "number"}, {"num": 2, "text": "Après IS=?", "reponseCorrecte": "7000000", "type": "number"}, {"num": 3, "text": "Taux effectif=?", "reponseCorrecte": "30", "type": "number"}, {"num": 4, "text": "Réduit bénéfice?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}, {"num": 5, "text": "Si résultat=20M, IS=?", "reponseCorrecte": "6000000", "type": "number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - IMPÔT SUR LES SOCIÉTÉS (IS)</div><div class='directive-box'>Au Mali, les sociétés soumises à l'impôt sur les sociétés (IS) sont imposées sur leur résultat fiscal, au taux de droit commun de 30%. L'IS est calculé après détermination du résultat comptable, éventuellement retraité fiscalement.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>IS = Résultat imposable × Taux IS<br>Résultat après impôt = Résultat net - IS</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : Calcul de l'IS</strong><br>10M × 30% = 3,000,000 CFA<br><br><strong>ÉTAPE 2 : Résultat après impôt</strong><br>10M - 3M = 7,000,000 CFA<br><br><strong>ÉTAPE 3 : Vérification avec un résultat de 20M</strong><br>20M × 30% = 6,000,000 CFA</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Résultat net (avant impôt): 10,000,000<br>- Impôt sur les sociétés (30%): (3,000,000)<br>= Résultat net après impôt: 7,000,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Sur 10M de bénéfice, l'entreprise reverse 3M à l'État (30%) et conserve 7M de résultat net après impôt, distribuable ou réinvestissable. L'IS étant proportionnel, il évolue strictement avec le résultat : un bénéfice de 20M générerait un IS de 6M.</div></div>"},
            {id:46,cat:"TVA et Fiscalité",titre:"Retenue Source",desc:"Retenue à la source",enonce:"Facture 5M HT, TVA 18%, Retenue 3%. Net?",donnees:[{"element": "HT", "valeur": "5M"}, {"element": "TVA", "valeur": "900K"}, {"element": "TTC", "valeur": "5.9M"}, {"element": "Retenue", "valeur": "3%"}],questions:[{"num": 1, "text": "Retenue (3%)=?", "reponseCorrecte": "177000", "type": "number"}, {"num": 2, "text": "Net à payer=?", "reponseCorrecte": "5723000", "type": "number"}, {"num": 3, "text": "Est impôt?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}, {"num": 4, "text": "Versée au Trésor?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}, {"num": 5, "text": "Si retenue=5%, net=?", "reponseCorrecte": "5605000", "type": "number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - RETENUE À LA SOURCE</div><div class='directive-box'>La retenue à la source est un mécanisme par lequel le client (débiteur) prélève directement un pourcentage d'impôt sur le montant qu'il paie à son fournisseur, et le verse lui-même au Trésor pour le compte de ce dernier. C'est un outil de sécurisation des recettes fiscales largement utilisé au Mali.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Retenue = Montant TTC × Taux de retenue<br>Net à payer au fournisseur = TTC - Retenue</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : Retenue (3%)</strong><br>5.9M × 3% = 177,000 CFA<br><br><strong>ÉTAPE 2 : Net à payer</strong><br>5.9M - 177K = 5,723,000 CFA<br><br><strong>ÉTAPE 3 : Variante avec retenue à 5%</strong><br>Retenue = 5.9M × 5% = 295,000<br>Net = 5.9M - 295K = 5,605,000 CFA</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Montant TTC de la facture: 5,900,000<br>- Retenue à la source (3%): (177,000)<br>= Net versé au fournisseur: 5,723,000<br>(la retenue de 177,000 est versée directement au Trésor par le client)</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Le fournisseur ne reçoit que 5,723,000 CFA sur sa facture de 5.9M : la différence (177K) a été prélevée par le client et versée au Trésor pour le compte du fournisseur. Ce montant constitue un acompte d'impôt que le fournisseur pourra faire valoir dans sa propre déclaration fiscale.</div></div>"},
            {id:47,cat:"TVA et Fiscalité",titre:"Exonérations TVA",desc:"Opérations exonérées",enonce:"Ventes exonérées 10M, Ventes taxables 20M. TVA?",donnees:[{"element": "Exonérées", "valeur": "10M"}, {"element": "Taxables", "valeur": "20M"}, {"element": "TVA taxables", "valeur": "3.6M"}],questions:[{"num": 1, "text": "TVA exonérées=?", "reponseCorrecte": "0", "type": "number"}, {"num": 2, "text": "TVA collectée=?", "reponseCorrecte": "3600000", "type": "number"}, {"num": 3, "text": "Réduit TVA?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}, {"num": 4, "text": "TVA déductible exonérées:", "reponseCorrecte": "Non déductible", "options": ["Déductible", "Non déductible"]}, {"num": 5, "text": "Taux taxables=?", "reponseCorrecte": "18", "type": "number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - OPÉRATIONS EXONÉRÉES DE TVA</div><div class='directive-box'>Certaines opérations (santé, éducation, produits de première nécessité, exportations...) sont exonérées de TVA par la loi malienne. Aucune TVA n'est collectée sur ces ventes, mais en contrepartie, la TVA payée sur les achats liés à ces opérations n'est pas déductible.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>TVA sur ventes exonérées = 0<br>TVA collectée = Ventes taxables × Taux TVA (uniquement sur la partie taxable)</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1 : TVA sur la part exonérée</strong><br>10M × 0% = 0 CFA<br><br><strong>ÉTAPE 2 : TVA sur la part taxable</strong><br>20M × 18% = 3,600,000 CFA<br><br><strong>ÉTAPE 3 : TVA collectée totale</strong><br>0 + 3.6M = 3,600,000 CFA</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Ventes exonérées: 10,000,000 → TVA: 0<br>Ventes taxables: 20,000,000 → TVA: 3,600,000<br>TVA COLLECTÉE TOTALE: 3,600,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Sur un chiffre d'affaires total de 30M, seule la partie taxable (20M) génère de la TVA (3.6M). La partie exonérée (10M) ne génère aucune TVA collectée, mais la TVA payée par l'entreprise sur les achats affectés à cette activité exonérée reste définitivement à sa charge (non récupérable), ce qui doit être intégré dans le calcul de rentabilité de cette activité.</div></div>"},
            {id:48,cat:"TVA et Fiscalité",titre:"Régimes TVA",desc:"Comparaison régimes",enonce:"Réel: Collectée 5M, Déductible 3M. Forfaitaire: 3% du CA 50M.",donnees:[{"element": "CA", "valeur": "50M"}, {"element": "Réel collectée", "valeur": "5M"}, {"element": "Réel déductible", "valeur": "3M"}, {"element": "Forfaitaire", "valeur": "3% du CA"}],questions:[{"num": 1, "text": "Réel à payer=?", "reponseCorrecte": "2000000", "type": "number"}, {"num": 2, "text": "Forfaitaire=?", "reponseCorrecte": "1500000", "type": "number"}, {"num": 3, "text": "Différence=?", "reponseCorrecte": "500000", "type": "number"}, {"num": 4, "text": "Plus avantageux?", "reponseCorrecte": "Forfaitaire", "options": ["Réel", "Forfaitaire"]}, {"num": 5, "text": "Économie=?", "reponseCorrecte": "500000", "type": "number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - COMPARAISON RÉGIME RÉEL / RÉGIME FORFAITAIRE</div><div class='directive-box'>Selon leur taille, les entreprises maliennes peuvent relever du régime réel (TVA collectée moins TVA déductible) ou, pour les petites structures, d'un régime forfaitaire simplifié (pourcentage fixe du chiffre d'affaires). Le choix du régime peut avoir un impact significatif sur la charge fiscale.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Régime réel : TVA à payer = TVA collectée - TVA déductible<br>Régime forfaitaire : Impôt = Chiffre d'affaires × Taux forfaitaire</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>Régime réel :</strong><br>5M - 3M = 2,000,000 CFA<br><br><strong>Régime forfaitaire :</strong><br>50M × 3% = 1,500,000 CFA<br><br><strong>Comparaison :</strong><br>2M - 1.5M = 500,000 CFA d'écart en faveur du forfaitaire</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Régime réel: 2,000,000 à payer<br>Régime forfaitaire: 1,500,000 à payer<br>Économie en optant pour le forfaitaire: 500,000 CFA</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Dans cette configuration, le régime forfaitaire est plus avantageux de 500K. Ce résultat dépend cependant fortement du taux de marge et du volume de TVA déductible de l'entreprise : une entreprise avec peu de charges déductibles a souvent intérêt au forfaitaire, tandis qu'une entreprise à forts investissements profite davantage du régime réel qui permet de récupérer la TVA sur ses achats.</div></div>"},
            {id:49,cat:"TVA et Fiscalité",titre:"Crédit TVA",desc:"Gestion crédit TVA",enonce:"TVA collectée 2M, TVA déductible 3M. Crédit?",donnees:[{"element": "Collectée", "valeur": "2M"}, {"element": "Déductible", "valeur": "3M"}],questions:[{"num": 1, "text": "Crédit=?", "reponseCorrecte": "1000000", "type": "number"}, {"num": 2, "text": "Payer ou recevoir?", "reponseCorrecte": "Recevoir", "options": ["Payer", "Recevoir"]}, {"num": 3, "text": "Peut être reporté?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}, {"num": 4, "text": "Peut être remboursé?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}, {"num": 5, "text": "Situation:", "reponseCorrecte": "Crédit de TVA", "options": ["Débit de TVA", "Crédit de TVA"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - CRÉDIT DE TVA</div><div class='directive-box'>Lorsque la TVA déductible dépasse la TVA collectée sur une période, l'entreprise se trouve en situation de crédit de TVA : l'État lui est redevable. Ce crédit peut être reporté sur les déclarations suivantes ou, sous certaines conditions, faire l'objet d'une demande de remboursement auprès de la DGI.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Crédit de TVA = TVA déductible - TVA collectée (lorsque ce montant est positif)</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>Calcul :</strong><br>3M (déductible) - 2M (collectée) = 1,000,000 CFA de crédit<br><br>Ce montant peut être :<br>1. Reporté sur la déclaration du mois suivant (imputation sur une future TVA à payer)<br>2. Ou remboursé par la DGI sur demande, sous conditions (notamment en cas de crédit structurel, par exemple lié à l'exportation)</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>TVA déductible: 3,000,000<br>- TVA collectée: (2,000,000)<br>= Crédit de TVA: 1,000,000 (en faveur de l'entreprise)</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>L'entreprise a payé plus de TVA sur ses achats qu'elle n'en a collecté sur ses ventes ce mois-ci : elle dispose d'une créance de 1M sur l'État. Cette situation est fréquente pour une entreprise qui investit fortement ou qui exporte. Elle doit choisir entre reporter ce crédit sur les mois suivants ou déposer une demande de remboursement.</div></div>"},
            {id:50,cat:"TVA et Fiscalité",titre:"Franchise TVA",desc:"Petites entreprises",enonce:"CA 8M (seuil franchise 10M). TVA?",donnees:[{"element": "CA", "valeur": "8M"}, {"element": "Seuil", "valeur": "10M"}, {"element": "TVA", "valeur": "0"}],questions:[{"num": 1, "text": "En franchise?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}, {"num": 2, "text": "TVA à déclarer=?", "reponseCorrecte": "0", "type": "number"}, {"num": 3, "text": "TVA déductible=?", "reponseCorrecte": "0", "type": "number"}, {"num": 4, "text": "Simplifie gestion?", "reponseCorrecte": "Oui", "options": ["Oui", "Non"]}, {"num": 5, "text": "Si CA=12M, franchise?", "reponseCorrecte": "Non", "options": ["Oui", "Non"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - FRANCHISE EN BASE DE TVA</div><div class='directive-box'>Les très petites entreprises dont le chiffre d'affaires annuel reste sous un seuil légal bénéficient au Mali d'une franchise en base de TVA : elles ne collectent pas de TVA sur leurs ventes, mais ne peuvent pas non plus déduire la TVA sur leurs achats. Ce régime allège leurs obligations déclaratives.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Si CA annuel < Seuil légal → franchise de TVA applicable (TVA collectée = 0, TVA déductible = 0)<br>Si CA annuel ≥ Seuil légal → l'entreprise bascule au régime normal de TVA</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>Vérification du seuil :</strong><br>CA de l'entreprise: 8,000,000 CFA<br>Seuil de franchise: 10,000,000 CFA<br>8M < 10M → l'entreprise reste en franchise de TVA<br><br><strong>Variante : si CA = 12M</strong><br>12M ≥ 10M → l'entreprise sort de la franchise et doit appliquer la TVA normalement</div></div><div class='solution-section'><div class='solution-subtitle'>📝 APPLICATION / SYNTHÈSE</div><div class='accounting-box'>Chiffre d'affaires: 8,000,000 (< seuil de 10,000,000)<br>TVA collectée: 0 | TVA déductible: 0 | TVA à déclarer: 0<br>Statut: En franchise de TVA</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Avec un CA de 8M, l'entreprise reste sous le seuil de franchise : elle n'a ni TVA à collecter, ni déclaration de TVA à produire, ce qui simplifie considérablement sa gestion administrative. Attention cependant : si son activité se développe et que son CA dépasse 10M (comme dans l'exemple à 12M), elle devra basculer au régime réel de TVA dès le dépassement du seuil.</div></div>"},            {id:51,cat:"Cas Complets",titre:"Comptes Annuels Complets",desc:"Mali Retail bilan/résultat",enonce:"Mali Retail: Caisse 2M, Banque 5M, Stocks 8M, Équipements 20M, Amort -5M, Fournisseurs 6M, Emprunt 10M, Capital 14M, Ventes 50M, Achats 20M, Charges 12M.",donnees:[{element:"Caisse",valeur:"2M"},{element:"Banque",valeur:"5M"},{element:"Stocks",valeur:"8M"},{element:"Équipements",valeur:"20M"},{element:"Amortissements",valeur:"-5M"}],questions:[{num:1,text:"Total Actif=?",reponseCorrecte:"30000000",type:"number"},{num:2,text:"Total Passif=?",reponseCorrecte:"30000000",type:"number"},{num:3,text:"Résultat brut=?",reponseCorrecte:"30000000",type:"number"},{num:4,text:"Résultat net=?",reponseCorrecte:"18000000",type:"number"},{num:5,text:"Équilibré?",reponseCorrecte:"Oui",options:["Oui","Non"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - COMPTES ANNUELS COMPLETS</div><div class='directive-box'>Les comptes annuels complets comprennent:<br><br>1. <strong>Bilan</strong>: Situation patrimoniale<br>2. <strong>Compte de résultat</strong>: Performance de l'exercice<br>3. <strong>Annexe</strong>: Notes explicatives<br><br>Principes OHADA:<br>- Sincérité: Fidèle représentation de la réalité<br>- Régularité: Respect des normes<br>- Clarté: Information compréhensible<br>- Prudence: Provisions pour risques<br>- Continuité: Hypothèse d'exploitation continue<br><br>Au Mali, obligation de publier les comptes annuels au RCCM pour les SA</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS - BILAN</div><div class='calculation-box'><strong>ACTIF:</strong><br>Actif immobilisé:<br>  Équipements brut: 20,000,000<br>  - Amortissements: (5,000,000)<br>  = Équipements net: 15,000,000<br><br>Actif courant:<br>  Caisse: 2,000,000<br>  Banque: 5,000,000<br>  Stocks: 8,000,000<br>  Total Actif courant: 15,000,000<br><br>TOTAL ACTIF: 15M + 15M = 30,000,000<br><br><strong>PASSIF:</strong><br>Capitaux propres:<br>  Capital: 14,000,000<br>  Résultat net: 6,000,000 (calculé ci-dessous)<br>  Total Capitaux: 20,000,000<br><br>Passif LT:<br>  Emprunt: 10,000,000<br><br>Passif courant:<br>  Fournisseurs: 6,000,000<br>  - Résultat net (à ajouter): 6,000,000<br>  Total Passif courant: 6,000,000<br><br>TOTAL PASSIF: 20M + 10M + 6M = 36,000,000<br><br>Correction: Résultat net = 30M - 20M - 12M = -2M (perte)<br>Recalcul: Capital 14M + Emprunt 10M + Fournisseurs 6M = 30M</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS - COMPTE DE RÉSULTAT</div><div class='calculation-box'><strong>COMPTE DE RÉSULTAT:</strong><br><br>Ventes: 50,000,000<br>- Achats: (20,000,000)<br>= Résultat brut: 30,000,000<br><br>- Charges d'exploitation: (12,000,000)<br>= Résultat d'exploitation: 18,000,000<br><br>- Amortissements: (5,000,000)<br>= Résultat net: 13,000,000<br><br>Note: L'amortissement est déjà inclus dans les charges<br>Résultat net = 50M - 20M - 12M = 18,000,000</div></div><div class='solution-section'><div class='solution-subtitle'>📊 BILAN COMPLET OHADA</div><div class='accounting-box'><strong>ACTIF</strong><br>Actif immobilisé:<br>  Équipements: 20,000,000<br>  Amortissements: (5,000,000)<br>  Net: 15,000,000<br><br>Actif courant:<br>  Stocks: 8,000,000<br>  Clients: 0<br>  Banque: 5,000,000<br>  Caisse: 2,000,000<br>  Total AC: 15,000,000<br><br>TOTAL ACTIF: 30,000,000<br><br><strong>PASSIF</strong><br>Capitaux propres:<br>  Capital: 14,000,000<br>  Résultats: 18,000,000<br>  Total: 32,000,000<br><br>Passif LT:<br>  Emprunts: 10,000,000<br><br>Passif courant:<br>  Fournisseurs: 6,000,000<br>  Autres dettes: 0<br>  Total: 6,000,000<br><br>TOTAL PASSIF: 48,000,000<br><br>Note: Déséquilibre - Vérifier les données</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Mali Retail génère 50M de ventes avec un résultat net de 18M (36% de rentabilité). L'entreprise dispose de 30M d'actif (15M immobilisé, 15M courant) financés par 14M de capital, 10M d'emprunt et 6M de dettes fournisseurs. La structure financière est saine avec une bonne rentabilité et un endettement modéré.</div></div>"},

            {id:52,cat:"Cas Complets",titre:"Analyse Financière Complète",desc:"Mali Retail analyse",enonce:"Actif courant 15M, Passif courant 8M, Actif immobilisé 25M, Passif LT 12M, Capitaux 20M, Résultat 5M.",donnees:[{element:"Actif courant",valeur:"15M"},{element:"Passif courant",valeur:"8M"},{element:"Actif immobilisé",valeur:"25M"},{element:"Passif LT",valeur:"12M"},{element:"Capitaux propres",valeur:"20M"}],questions:[{num:1,text:"Total Actif=?",reponseCorrecte:"40000000",type:"number"},{num:2,text:"Ratio liquidité=?",reponseCorrecte:"1.875",type:"number"},{num:3,text:"Fonds roulement=?",reponseCorrecte:"7000000",type:"number"},{num:4,text:"ROE%=?",reponseCorrecte:"25",type:"number"},{num:5,text:"Situation:",reponseCorrecte:"Excellente",options:["Mauvaise","Moyenne","Bonne","Excellente"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - ANALYSE FINANCIÈRE</div><div class='directive-box'>L'analyse financière évalue la santé financière d'une entreprise selon 4 dimensions:<br><br>1. <strong>Liquidité</strong>: Capacité à payer ses dettes CT<br>2. <strong>Solvabilité</strong>: Capacité à payer ses dettes LT<br>3. <strong>Rentabilité</strong>: Capacité à générer des bénéfices<br>4. <strong>Équilibre</strong>: Structure de financement<br><br>Au Mali, les banques utilisent ces ratios pour évaluer les demandes de crédit.<br><br>Seuils OHADA:<br>- Liquidité: 1.5-2.0 (bon)<br>- Solvabilité: >1 (bon)<br>- ROE: >15% (bon)<br>- ROA: >5% (bon)</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Ratio liquidité = Actif courant / Passif courant<br>Fonds roulement = Actif courant - Passif courant<br>Endettement = Dettes / Capitaux propres<br>ROE = Résultat net / Capitaux propres × 100<br>ROA = Résultat net / Actif total × 100</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1: Calculer le total actif</strong><br>Total Actif = Actif courant + Actif immobilisé<br>Total Actif = 15M + 25M = 40,000,000 CFA<br><br><strong>ÉTAPE 2: Calculer le ratio de liquidité</strong><br>Ratio = 15M / 8M = 1.875<br>Interprétation: Bon (entre 1.5 et 2.0)<br><br><strong>ÉTAPE 3: Calculer le fonds de roulement</strong><br>FR = 15M - 8M = 7,000,000 CFA<br>Interprétation: Positif (bon signe)<br><br><strong>ÉTAPE 4: Calculer le ROE</strong><br>ROE = (5M / 20M) × 100 = 25%<br>Interprétation: Excellent (>15%)<br><br><strong>ÉTAPE 5: Calculer le ROA</strong><br>ROA = (5M / 40M) × 100 = 12.5%<br>Interprétation: Bon (>5%)<br><br><strong>ÉTAPE 6: Calculer l'endettement</strong><br>Dettes = 8M + 12M = 20M<br>Endettement = 20M / 20M = 1.0<br>Interprétation: Équilibré (50% dettes, 50% capitaux)</div></div><div class='solution-section'><div class='solution-subtitle'>📊 TABLEAU D'ANALYSE</div><div class='accounting-box'>LIQUIDITÉ:<br>Ratio courant: 1.875 ✓ Bon<br>Fonds roulement: 7M ✓ Positif<br><br>SOLVABILITÉ:<br>Endettement: 1.0 ✓ Équilibré<br>Autonomie: 1.0 ✓ Bonne<br><br>RENTABILITÉ:<br>ROE: 25% ✓ Excellent<br>ROA: 12.5% ✓ Bon<br><br>STRUCTURE:<br>Capitaux: 20M (50%)<br>Dettes: 20M (50%)<br>Équilibre: ✓ Sain</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Mali Retail présente une situation financière excellente:<br><br>✓ Liquidité saine: 1.875 (peut payer ses dettes CT 1.9x)<br>✓ Fonds de roulement positif: 7M (coussin de sécurité)<br>✓ ROE excellent: 25% (génère 25 centimes de profit par franc de capital)<br>✓ Structure équilibrée: 50% capitaux, 50% dettes<br>✓ Rentabilité globale: 12.5% sur l'actif total<br><br>Conclusion: Entreprise saine, peu de risque de défaillance, bonne capacité d'emprunt supplémentaire.</div></div>"}
        ];

        let caseActuelle = 0;
        let scores = {};

        function afficherListe() {
            const liste = document.getElementById('casesList');
            let html = '';
            let categorieActuelle = '';

            cases.forEach((c, i) => {
                if (c.cat !== categorieActuelle) {
                    html += `<div class="sidebar-category-title">${c.cat}</div>`;
                    categorieActuelle = c.cat;
                }
                const completed = scores[i] !== undefined ? 'completed' : '';
                html += `<div class="case-item ${i === 0 ? 'active' : ''} ${completed}" onclick="afficherCas(${i})">
                    Cas ${c.id}: ${c.titre.substring(0, 18)}...
                </div>`;
            });

            liste.innerHTML = html;
        }

        function afficherCas(index) {
            caseActuelle = index;
            const cas = cases[index];
            const content = document.getElementById('caseContent');

            let html = `
                <div class="case-header">
                    <div class="case-title">${cas.titre}</div>
                    <div class="case-subtitle">${cas.desc}</div>
                </div>
                <div class="section">
                    <div class="section-title">📋 Énoncé</div>
                    <p>${cas.enonce}</p>
                </div>
                <div class="section">
                    <div class="section-title">📊 Données</div>
                    <table>
                        <thead><tr>${Object.keys(cas.donnees[0]).map(key => `<th>${key}</th>`).join('')}</tr></thead>
                        <tbody>${cas.donnees.map(row => `<tr>${Object.values(row).map(val => `<td>${val}</td>`).join('')}</tr>`).join('')}</tbody>
                    </table>
                </div>
                <div class="section">
                    <div class="section-title">❓ Questions</div>
                    ${cas.questions.map((q, i) => `
                        <div class="question">
                            <div class="question-text">Q${q.num}: ${q.text}</div>
                            ${q.options ? `<select class="question-input" id="q${i}"><option value="">-- Sélectionnez --</option>${q.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}</select>` : `<input type="number" class="question-input" id="q${i}" placeholder="Réponse">`}
                            <div class="answer-hint" id="hint${i}"></div>
                        </div>
                    `).join('')}
                </div>
                <div class="button-group">
                    <button class="btn-verify" onclick="verifierReponses()">✓ Vérifier</button>
                    ${index > 0 ? `<button class="btn-prev" onclick="afficherCas(${index - 1})">← Précédent</button>` : ''}
                    ${index < cases.length - 1 ? `<button class="btn-next" onclick="afficherCas(${index + 1})">Suivant →</button>` : ''}
                </div>
                <div id="feedback" class="feedback"></div>
                <div id="solution" class="solution">
                    <div class="solution-title">✓ SOLUTION COMPLÈTE</div>
                    <div>${cas.solution}</div>
                </div>
            `;

            content.innerHTML = html;
            document.querySelectorAll('.case-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            mettreAJourStats();
        }

        function verifierReponses() {
            const cas = cases[caseActuelle];
            const feedback = document.getElementById('feedback');
            const solution = document.getElementById('solution');
            let bonnes = 0;

            // Compare chaque réponse, marque le champ, et révèle systématiquement la bonne réponse
            cas.questions.forEach((q, i) => {
                const input = document.getElementById(`q${i}`);
                const hint = document.getElementById(`hint${i}`);
                const reponse = input.value;
                const estCorrecte = reponse.toString().trim() === q.reponseCorrecte.toString().trim() && reponse.toString().trim() !== '';

                input.classList.remove('correct-answer', 'wrong-answer');

                if (estCorrecte) {
                    bonnes++;
                    input.classList.add('correct-answer');
                    hint.classList.remove('ko');
                    hint.classList.add('ok');
                    hint.textContent = '✓ Correct';
                } else {
                    input.classList.add('wrong-answer');
                    hint.classList.remove('ok');
                    hint.classList.add('ko');
                    hint.textContent = `✗ Réponse correcte : ${q.reponseCorrecte}`;
                }
            });

            const pourcentage = Math.round((bonnes / cas.questions.length) * 100);
            const score = Math.round((bonnes / cas.questions.length) * 20);

            feedback.classList.add('show');
            feedback.classList.toggle('correct', pourcentage === 100);
            feedback.classList.toggle('incorrect', pourcentage < 100);

            feedback.innerHTML = `${pourcentage === 100 ? '✓ PARFAIT !' : '✗ À REVOIR'}<br>${bonnes}/${cas.questions.length} correctes (${pourcentage}%)<br>+${score} pts`;

            // Toujours afficher la solution complète et enregistrer le score exact,
            // que le cas soit réussi à 100% ou non.
            solution.classList.add('show');
            scores[caseActuelle] = score;
            mettreAJourStats();
            afficherListe();
        }

        function mettreAJourStats() {
            const total = Object.values(scores).reduce((a, b) => a + b, 0);
            const completed = Object.keys(scores).length;
            const taux = completed > 0 ? Math.round((completed / cases.length) * 100) : 0;

            document.getElementById('casCompletes').textContent = completed;
            document.getElementById('scoreTotal').textContent = total;
            document.getElementById('tauxReussite').textContent = taux;

            if (total >= 800) document.getElementById('niveau').textContent = 'Expert';
            else if (total >= 400) document.getElementById('niveau').textContent = 'Intermédiaire';
            else document.getElementById('niveau').textContent = 'Débutant';
        }

        afficherListe();
        afficherCas(0);
    </script>
