    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1600px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .header-item { text-align: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; }
        .header-label { font-size: 11px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .header-value { font-size: 28px; font-weight: bold; }
        .main { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 250px); }
        .sidebar { background: #f8f9fa; padding: 20px; border-right: 2px solid #e0e0e0; overflow-y: auto; max-height: calc(100vh - 250px); }
        .sidebar-category { margin-bottom: 25px; }
        .sidebar-category-title { font-weight: bold; color: #667eea; margin-bottom: 12px; font-size: 11px; text-transform: uppercase; padding: 10px; background: rgba(102, 126, 234, 0.1); border-radius: 5px; }
        .case-item { padding: 8px; margin-bottom: 6px; background: white; border-left: 4px solid #ddd; cursor: pointer; border-radius: 5px; transition: all 0.3s; font-size: 11px; line-height: 1.3; }

        .case-item.completed.active { background: #28a745; color: white; }
        .content { padding: 40px; overflow-y: auto; max-height: calc(100vh - 250px); background: white; }
        .case-header { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 3px solid #667eea; }
        .case-title { color: #667eea; font-size: 28px; margin-bottom: 8px; font-weight: bold; }
        .case-subtitle { color: #666; font-size: 14px; }
        .section { margin-bottom: 25px; padding: 20px; background: #f8f9fa; border-radius: 10px; border-left: 5px solid #667eea; }
        .section-title { color: #667eea; font-size: 16px; font-weight: bold; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; background: white; border-radius: 8px; font-size: 12px; }

        .question-text { font-weight: bold; color: #333; margin-bottom: 8px; font-size: 13px; }
        .question-input { width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 5px; font-size: 13px; }
        .question-input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 5px rgba(102, 126, 234, 0.3); }
        .button-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        button { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s; font-size: 13px; }
        .btn-verify { background: #667eea; color: white; flex: 1; min-width: 120px; }
        .btn-verify:hover { background: #5568d3; transform: translateY(-2px); }
        .btn-next { background: #764ba2; color: white; flex: 1; min-width: 120px; }
        .btn-next:hover { background: #6a3f8f; }
        .btn-prev { background: #6c757d; color: white; flex: 1; min-width: 120px; }
        .feedback { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; font-weight: bold; font-size: 13px; }
        .feedback.show { display: block; }
        .feedback.correct { background: #d4edda; color: #155724; border: 2px solid #28a745; }
        .feedback.incorrect { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
        .solution { margin-top: 20px; padding: 20px; background: #e7f3ff; border-left: 5px solid #2196F3; border-radius: 8px; display: none; font-size: 12px; line-height: 1.8; max-height: 600px; overflow-y: auto; }
        .solution.show { display: block; }
        .solution-title { color: #1976D2; font-weight: bold; margin-bottom: 15px; font-size: 14px; }

        .solution-subtitle { color: #1976D2; font-weight: bold; margin-bottom: 8px; font-size: 12px; }
        .formula-box { background: #fff9e6; padding: 12px; border-radius: 5px; margin: 8px 0; border-left: 4px solid #ffc107; font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.6; }
        .directive-box { background: #fff3cd; padding: 12px; border-radius: 5px; margin: 8px 0; border-left: 4px solid #ffc107; font-size: 11px; line-height: 1.6; }
        .calculation-box { background: #f0f8ff; padding: 12px; border-radius: 5px; margin: 8px 0; border-left: 4px solid #2196F3; font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.6; }
        .accounting-box { background: #e8f5e9; padding: 12px; border-radius: 5px; margin: 8px 0; border-left: 4px solid #4caf50; font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.6; }
        .interpretation-box { background: #f3e5f5; padding: 12px; border-radius: 5px; margin: 8px 0; border-left: 4px solid #9c27b0; font-size: 11px; line-height: 1.6; }

<body>

    <script>
        const cases = [
            {id:1,cat:"Comptabilité Générale",titre:"Classification des Comptes",desc:"Mali Retail",enonce:"Caisse 5M, Fournisseurs 3M, Ventes 8M, Loyer 500K, Banque 2M. Classifiez.",donnees:[{compte:"Caisse",montant:"5M"},{compte:"Fournisseurs",montant:"3M"},{compte:"Ventes",montant:"8M"},{compte:"Loyer",montant:"500K"},{compte:"Banque",montant:"2M"}],questions:[{num:1,text:"Caisse est:",reponseCorrecte:"Actif",options:["Actif","Passif","Charges","Produits"]},{num:2,text:"Fournisseurs est:",reponseCorrecte:"Passif",options:["Actif","Passif","Charges","Produits"]},{num:3,text:"Ventes est:",reponseCorrecte:"Produits",options:["Actif","Passif","Charges","Produits"]},{num:4,text:"Loyer est:",reponseCorrecte:"Charges",options:["Actif","Passif","Charges","Produits"]},{num:5,text:"Banque est:",reponseCorrecte:"Actif",options:["Actif","Passif","Charges","Produits"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA/MALI</div><div class='directive-box'>Selon le Système Comptable OHADA (Acte Uniforme du 26 janvier 2017), les comptes sont classés en 5 catégories:<br><br>1. <strong>ACTIF</strong>: Ressources de l'entreprise (Caisse, Banque, Stocks, Équipements)<br>2. <strong>PASSIF</strong>: Dettes et obligations (Fournisseurs, Emprunts, Dettes fiscales)<br>3. <strong>CHARGES</strong>: Dépenses d'exploitation (Loyer, Électricité, Salaires)<br>4. <strong>PRODUITS</strong>: Revenus d'exploitation (Ventes, Services, Intérêts)<br>5. <strong>CAPITAUX PROPRES</strong>: Capital social, Réserves, Résultats</div></div><div class='solution-section'><div class='solution-subtitle'>✓ CLASSIFICATION DÉTAILLÉE</div><div class='calculation-box'><strong>Caisse 5M</strong> → ACTIF (Compte 51)<br>Raison: Ressource monétaire immédiate de l'entreprise<br><br><strong>Fournisseurs 3M</strong> → PASSIF (Compte 401)<br>Raison: Dette envers les fournisseurs<br><br><strong>Ventes 8M</strong> → PRODUITS (Compte 701)<br>Raison: Revenu principal d'exploitation<br><br><strong>Loyer 500K</strong> → CHARGES (Compte 613)<br>Raison: Dépense d'exploitation (immobilier)<br><br><strong>Banque 2M</strong> → ACTIF (Compte 512)<br>Raison: Ressource monétaire à la banque</div></div><div class='solution-section'><div class='solution-subtitle'>📊 RÉSUMÉ CLASSIFICATION</div><div class='accounting-box'>ACTIF (Ressources): Caisse 5M + Banque 2M = 7M<br>PASSIF (Dettes): Fournisseurs 3M = 3M<br>PRODUITS (Revenus): Ventes 8M = 8M<br>CHARGES (Dépenses): Loyer 500K = 500K</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>L'entreprise dispose de 7M en ressources monétaires (Actif), doit 3M aux fournisseurs (Passif), génère 8M de revenus (Produits) et supporte 500K de charges (Loyer). La classification correcte est essentielle pour établir le bilan et le compte de résultat.</div></div>"},
            {id:2,cat:"Comptabilité Générale",titre:"Calcul de TVA",desc:"Achat et vente 18%",enonce:"Achat 10M HT, Vente 15M HT. TVA=18%. Calculez TVA et TTC.",donnees:[{operation:"Achat",montantHT:"10M",tauxTVA:"18%"},{operation:"Vente",montantHT:"15M",tauxTVA:"18%"}],questions:[{num:1,text:"TVA achat=?",reponseCorrecte:"1800000",type:"number"},{num:2,text:"TTC achat=?",reponseCorrecte:"11800000",type:"number"},{num:3,text:"TVA vente=?",reponseCorrecte:"2700000",type:"number"},{num:4,text:"TTC vente=?",reponseCorrecte:"17700000",type:"number"},{num:5,text:"TVA à déclarer=?",reponseCorrecte:"900000",type:"number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA/MALI - TVA</div><div class='directive-box'>Au Mali, la TVA (Taxe sur la Valeur Ajoutée) est un impôt indirect sur la consommation.<br><br><strong>Taux standard au Mali: 18%</strong><br><br>Principe: TVA collectée (sur ventes) - TVA déductible (sur achats) = TVA à déclarer/payer<br><br>La TVA est neutre pour l'entreprise qui agit comme collecteur pour l'État. Elle doit reverser la différence au Trésor.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>TVA = Montant HT × Taux TVA<br>TTC = Montant HT + TVA<br>TVA à déclarer = TVA collectée - TVA déductible</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS ÉTAPE PAR ÉTAPE</div><div class='calculation-box'><strong>ACHAT:</strong><br>TVA achat = 10M × 18% = 10,000,000 × 0.18 = 1,800,000 CFA<br>TTC achat = 10M + 1.8M = 11,800,000 CFA<br><br><strong>VENTE:</strong><br>TVA vente = 15M × 18% = 15,000,000 × 0.18 = 2,700,000 CFA<br>TTC vente = 15M + 2.7M = 17,700,000 CFA<br><br><strong>TVA À DÉCLARER:</strong><br>TVA collectée (vente) = 2,700,000 CFA<br>TVA déductible (achat) = 1,800,000 CFA<br>TVA à déclarer = 2.7M - 1.8M = 900,000 CFA (À PAYER au Trésor Mali)</div></div><div class='solution-section'><div class='solution-subtitle'>📝 COMPTABILISATION OHADA</div><div class='accounting-box'><strong>À l'achat:</strong><br>Débit 60 (Achats): 10,000,000<br>Débit 4426 (TVA déductible): 1,800,000<br>Crédit 401 (Fournisseurs): 11,800,000<br><br><strong>À la vente:</strong><br>Débit 411 (Clients): 17,700,000<br>Crédit 701 (Ventes): 15,000,000<br>Crédit 4421 (TVA collectée): 2,700,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>L'entreprise collecte 2.7M de TVA sur ses ventes mais peut déduire 1.8M de TVA sur ses achats. Elle doit donc verser 900K au Trésor Mali. Ce montant représente la TVA réelle sur la valeur ajoutée (15M - 10M = 5M) × 18% = 900K.</div></div>"},
            {id:3,cat:"Comptabilité Générale",titre:"Calcul de Marges",desc:"Rentabilité produits",enonce:"Tissu A: Coût 2M, Vente 3M. Tissu B: Coût 1.5M, Vente 2.5M. Marges?",donnees:[{tissu:"A",cout:"2M",vente:"3M"},{tissu:"B",cout:"1.5M",vente:"2.5M"}],questions:[{num:1,text:"Marge A=?",reponseCorrecte:"1000000",type:"number"},{num:2,text:"Taux A%=?",reponseCorrecte:"50",type:"number"},{num:3,text:"Marge B=?",reponseCorrecte:"1000000",type:"number"},{num:4,text:"Taux B%=?",reponseCorrecte:"66.67",type:"number"},{num:5,text:"Plus rentable?",reponseCorrecte:"Tissu B",options:["Tissu A","Tissu B"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - MARGES</div><div class='directive-box'>La marge commerciale représente la différence entre le prix de vente et le coût d'achat. Elle mesure la rentabilité du produit.<br><br>Deux indicateurs:<br>1. <strong>Marge absolue</strong>: Vente - Coût (en CFA)<br>2. <strong>Taux de marge</strong>: (Marge / Coût) × 100 (en %)<br><br>Le taux de marge permet de comparer la rentabilité entre produits.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Marge = Prix de vente - Coût d'achat<br>Taux de marge = (Marge / Coût) × 100<br>Taux de marque = (Marge / Vente) × 100</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>TISSU A:</strong><br>Marge = 3M - 2M = 1,000,000 CFA<br>Taux = (1M / 2M) × 100 = 50%<br><br><strong>TISSU B:</strong><br>Marge = 2.5M - 1.5M = 1,000,000 CFA<br>Taux = (1M / 1.5M) × 100 = 66.67%<br><br><strong>COMPARAISON:</strong><br>Marge absolue: Égale (1M chacun)<br>Taux de marge: B > A (66.67% > 50%)<br>Conclusion: Tissu B est plus rentable</div></div><div class='solution-section'><div class='solution-subtitle'>📝 COMPTABILISATION</div><div class='accounting-box'>À la vente du Tissu A:<br>Débit 411 (Clients): 3,000,000<br>Crédit 701 (Ventes): 3,000,000<br><br>À la vente du Tissu B:<br>Débit 411 (Clients): 2,500,000<br>Crédit 701 (Ventes): 2,500,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Bien que les deux produits génèrent la même marge absolue (1M), le Tissu B est plus rentable car il génère 66.67% de marge sur son coût contre 50% pour le Tissu A. Pour un coût de 1.5M, le Tissu B génère autant de profit que le Tissu A pour un coût de 2M. L'entreprise devrait privilégier le Tissu B.</div></div>"},
            {id:4,cat:"Comptabilité Générale",titre:"Enregistrement Facture",desc:"Comptabilisation achat",enonce:"Facture 5M HT (TVA 18%). Enregistrez.",donnees:[{element:"HT",valeur:"5M"},{element:"TVA",valeur:"900K"},{element:"TTC",valeur:"5.9M"}],questions:[{num:1,text:"Compte débité:",reponseCorrecte:"Achats",options:["Achats","Ventes","Banque"]},{num:2,text:"Montant débité=?",reponseCorrecte:"5900000",type:"number"},{num:3,text:"Compte crédité:",reponseCorrecte:"Fournisseurs",options:["Fournisseurs","Clients","Banque"]},{num:4,text:"TVA récupérable=?",reponseCorrecte:"900000",type:"number"},{num:5,text:"TVA est:",reponseCorrecte:"Actif",options:["Actif","Passif"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - ENREGISTREMENT ACHAT</div><div class='directive-box'>Selon le Plan Comptable OHADA, l'enregistrement d'une facture d'achat comporte:<br><br>1. <strong>Compte 60 (Achats)</strong>: Montant HT uniquement<br>2. <strong>Compte 4426 (TVA déductible)</strong>: TVA récupérable<br>3. <strong>Compte 401 (Fournisseurs)</strong>: Montant TTC<br><br>La TVA déductible est un actif car elle peut être récupérée.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>TVA = HT × 18%<br>TTC = HT + TVA<br>Écriture: Débit Achats (HT) + Débit TVA (TVA) = Crédit Fournisseurs (TTC)</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS</div><div class='calculation-box'>HT = 5,000,000 CFA<br>TVA = 5M × 18% = 900,000 CFA<br>TTC = 5M + 900K = 5,900,000 CFA<br><br>Vérification: 5M + 900K = 5.9M ✓</div></div><div class='solution-section'><div class='solution-subtitle'>📝 COMPTABILISATION OHADA</div><div class='accounting-box'><strong>ÉCRITURE D'ACHAT:</strong><br><br>Débit 60 (Achats): 5,000,000<br>Débit 4426 (TVA déductible): 900,000<br>Crédit 401 (Fournisseurs): 5,900,000<br><br>Libellé: Facture achat du [date]<br><br>Vérification: Débits = Crédits<br>5M + 900K = 5.9M ✓</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>La TVA de 900K est enregistrée comme actif (4426) car elle peut être déduite de la TVA collectée. Le montant débité au compte Fournisseurs est le TTC (5.9M) car c'est ce que l'entreprise doit payer. Le compte Achats (60) n'enregistre que le HT (5M) pour permettre le calcul correct du coût des ventes.</div></div>"},
            {id:5,cat:"Comptabilité Générale",titre:"Calcul du Résultat",desc:"Résultat net",enonce:"Ventes 20M, Achats 8M, Loyer 1M, Électricité 500K, Salaires 2M. Résultat?",donnees:[{element:"Ventes",valeur:"20M"},{element:"Achats",valeur:"8M"},{element:"Loyer",valeur:"1M"},{element:"Électricité",valeur:"500K"},{element:"Salaires",valeur:"2M"}],questions:[{num:1,text:"Charges totales=?",reponseCorrecte:"11500000",type:"number"},{num:2,text:"Résultat brut=?",reponseCorrecte:"12000000",type:"number"},{num:3,text:"Résultat net=?",reponseCorrecte:"8500000",type:"number"},{num:4,text:"Taux marge%=?",reponseCorrecte:"42.5",type:"number"},{num:5,text:"Rentable?",reponseCorrecte:"Oui",options:["Oui","Non"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - RÉSULTAT</div><div class='directive-box'>Le résultat net est calculé selon le compte de résultat OHADA:<br><br><strong>Résultat brut</strong> = Ventes - Achats<br><strong>Résultat d'exploitation</strong> = Résultat brut - Charges d'exploitation<br><strong>Résultat net</strong> = Résultat d'exploitation - Charges financières - Impôts<br><br>Pour cet exercice: Résultat net = Ventes - Charges totales</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Charges totales = Achats + Loyer + Électricité + Salaires<br>Résultat brut = Ventes - Achats<br>Résultat net = Ventes - Charges totales<br>Taux de marge = (Résultat net / Ventes) × 100</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1: Calculer les charges totales</strong><br>Achats: 8,000,000<br>Loyer: 1,000,000<br>Électricité: 500,000<br>Salaires: 2,000,000<br>Total charges = 8M + 1M + 500K + 2M = 11,500,000 CFA<br><br><strong>ÉTAPE 2: Calculer le résultat brut</strong><br>Résultat brut = 20M - 8M = 12,000,000 CFA<br><br><strong>ÉTAPE 3: Calculer le résultat net</strong><br>Résultat net = 20M - 11.5M = 8,500,000 CFA<br><br><strong>ÉTAPE 4: Calculer le taux de marge</strong><br>Taux = (8.5M / 20M) × 100 = 42.5%</div></div><div class='solution-section'><div class='solution-subtitle'>📝 COMPTE DE RÉSULTAT SIMPLIFIÉ</div><div class='accounting-box'>Ventes: 20,000,000<br>- Achats: (8,000,000)<br>= Résultat brut: 12,000,000<br>- Charges d'exploitation:<br>  Loyer: (1,000,000)<br>  Électricité: (500,000)<br>  Salaires: (2,000,000)<br>= Résultat net: 8,500,000<br><br>Taux de marge: 42.5%</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>L'entreprise génère 20M de ventes et supporte 11.5M de charges, ce qui produit un résultat net de 8.5M. Le taux de marge de 42.5% signifie que pour chaque franc de vente, l'entreprise conserve 42.5 centimes de bénéfice. C'est une rentabilité correcte pour une entreprise commerciale au Mali.</div></div>"},
            {id:6,cat:"Comptabilité Générale",titre:"Amortissement",desc:"Amortissement linéaire",enonce:"Équipement 10M, Durée 5 ans. Amortissement?",donnees:[{element:"Coût",valeur:"10M"},{element:"Durée",valeur:"5 ans"}],questions:[{num:1,text:"Taux%=?",reponseCorrecte:"20",type:"number"},{num:2,text:"Annuel=?",reponseCorrecte:"2000000",type:"number"},{num:3,text:"3 ans=?",reponseCorrecte:"6000000",type:"number"},{num:4,text:"Valeur nette 3 ans=?",reponseCorrecte:"4000000",type:"number"},{num:5,text:"Après 5 ans=?",reponseCorrecte:"0",type:"number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - AMORTISSEMENT</div><div class='directive-box'>L'amortissement linéaire est la méthode standard au Mali/OHADA. Elle répartit le coût d'acquisition d'un bien sur sa durée d'utilité de manière égale chaque année.<br><br><strong>Durées usuelles au Mali:</strong><br>- Bâtiments: 20-40 ans<br>- Équipements: 5-10 ans<br>- Véhicules: 5 ans<br>- Mobilier: 10 ans<br><br>L'amortissement est une charge qui réduit le résultat et la valeur nette du bien.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Taux d'amortissement = 100% / Durée en années<br>Annuité = Coût × Taux<br>Cumul n années = Annuité × n<br>Valeur nette = Coût - Cumul amortissements</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1: Calculer le taux</strong><br>Taux = 100% / 5 ans = 20% par an<br><br><strong>ÉTAPE 2: Calculer l'annuité</strong><br>Annuité = 10M × 20% = 2,000,000 CFA par an<br><br><strong>ÉTAPE 3: Calculer les amortissements cumulés (3 ans)</strong><br>Cumul 3 ans = 2M × 3 = 6,000,000 CFA<br><br><strong>ÉTAPE 4: Calculer la valeur nette (3 ans)</strong><br>Valeur nette = 10M - 6M = 4,000,000 CFA<br><br><strong>ÉTAPE 5: Après 5 ans</strong><br>Cumul 5 ans = 2M × 5 = 10,000,000 CFA<br>Valeur nette = 10M - 10M = 0 CFA (Bien complètement amorti)</div></div><div class='solution-section'><div class='solution-subtitle'>📊 TABLEAU D'AMORTISSEMENT</div><div class='accounting-box'>Année 1: Annuité 2M | Cumul 2M | Valeur nette 8M<br>Année 2: Annuité 2M | Cumul 4M | Valeur nette 6M<br>Année 3: Annuité 2M | Cumul 6M | Valeur nette 4M<br>Année 4: Annuité 2M | Cumul 8M | Valeur nette 2M<br>Année 5: Annuité 2M | Cumul 10M | Valeur nette 0M</div></div><div class='solution-section'><div class='solution-subtitle'>📝 COMPTABILISATION ANNUELLE</div><div class='accounting-box'>Chaque année (ex. Année 1):<br><br>Débit 681 (Dotation amortissements): 2,000,000<br>Crédit 281 (Amortissements équipements): 2,000,000<br><br>Libellé: Dotation amortissement équipement</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>L'équipement de 10M est amorti linéairement sur 5 ans. Chaque année, 2M est enregistré comme charge (681) et réduit la valeur nette du bien au bilan. Après 3 ans, l'équipement a une valeur nette de 4M. Après 5 ans, il est complètement amorti (valeur nette = 0) mais peut continuer à être utilisé.</div></div>"},
            {id:7,cat:"Comptabilité Générale",titre:"Provisions",desc:"Créances douteuses",enonce:"Client A 2M, Client B 1.5M (50% risque), Client C 500K. Provisions?",donnees:[{client:"A",creance:"2M",risque:"Faible"},{client:"B",creance:"1.5M",risque:"Élevé"},{client:"C",creance:"500K",risque:"Faible"}],questions:[{num:1,text:"Total créances=?",reponseCorrecte:"4000000",type:"number"},{num:2,text:"Provision B=?",reponseCorrecte:"750000",type:"number"},{num:3,text:"Total provisions=?",reponseCorrecte:"750000",type:"number"},{num:4,text:"Créances nettes=?",reponseCorrecte:"3250000",type:"number"},{num:5,text:"Provision est charge?",reponseCorrecte:"Oui",options:["Oui","Non"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - PROVISIONS</div><div class='directive-box'>Les provisions pour créances douteuses sont constituées pour couvrir le risque de non-recouvrement des créances clients.<br><br>Selon OHADA:<br>- Créances sans risque: 0% de provision<br>- Créances à risque faible: 0-25% de provision<br>- Créances à risque élevé: 25-100% de provision<br><br>La provision est une charge qui réduit le résultat et la valeur des créances au bilan.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Provision = Créance × Taux de risque<br>Total créances = Somme des créances<br>Créances nettes = Total créances - Total provisions<br>Taux de risque: Déterminé selon l'ancienneté et la situation du client</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1: Identifier les risques</strong><br>Client A (2M): Risque faible → Taux 0%<br>Client B (1.5M): Risque élevé → Taux 50%<br>Client C (500K): Risque faible → Taux 0%<br><br><strong>ÉTAPE 2: Calculer les provisions</strong><br>Provision A = 2M × 0% = 0 CFA<br>Provision B = 1.5M × 50% = 750,000 CFA<br>Provision C = 500K × 0% = 0 CFA<br>Total provisions = 0 + 750K + 0 = 750,000 CFA<br><br><strong>ÉTAPE 3: Calculer les créances nettes</strong><br>Total créances = 2M + 1.5M + 500K = 4,000,000 CFA<br>Créances nettes = 4M - 750K = 3,250,000 CFA</div></div><div class='solution-section'><div class='solution-subtitle'>📝 COMPTABILISATION</div><div class='accounting-box'><strong>À la constitution de la provision:</strong><br><br>Débit 691 (Dotation provisions): 750,000<br>Crédit 491 (Provisions créances): 750,000<br><br>Libellé: Provision pour créances douteuses<br><br><strong>Au bilan:</strong><br>Créances clients: 4,000,000<br>- Provisions: (750,000)<br>= Créances nettes: 3,250,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>L'entreprise a 4M de créances clients. Seul le Client B présente un risque (50%), ce qui justifie une provision de 750K. Les créances nettes au bilan sont donc 3.25M. Si le Client B ne paie pas, la provision couvrira la perte. Si le Client B paie, la provision sera reprise en produit.</div></div>"},
            {id:8,cat:"Comptabilité Générale",titre:"Stocks",desc:"Variation stocks",enonce:"SI 5M, Achats 8M, SF 4M. Coût des ventes?",donnees:[{element:"SI",valeur:"5M"},{element:"Achats",valeur:"8M"},{element:"SF",valeur:"4M"}],questions:[{num:1,text:"Disponible=?",reponseCorrecte:"13000000",type:"number"},{num:2,text:"Coût ventes=?",reponseCorrecte:"9000000",type:"number"},{num:3,text:"Variation=?",reponseCorrecte:"-1000000",type:"number"},{num:4,text:"Variation est:",reponseCorrecte:"Produit",options:["Charge","Produit"]},{num:5,text:"Si ventes=15M, brut=?",reponseCorrecte:"6000000",type:"number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - STOCKS</div><div class='directive-box'>La variation de stocks représente la différence entre le stock initial et le stock final. Elle affecte le résultat de l'exercice.<br><br>Principe:<br>- Stock initial (SI): Stock au début de l'exercice<br>- Achats: Acquisitions pendant l'exercice<br>- Stock final (SF): Stock à la fin de l'exercice<br>- Coût des ventes = SI + Achats - SF<br>- Variation = SF - SI (Produit si positive, Charge si négative)<br><br>Au Mali, la variation de stocks est enregistrée au compte 603.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Disponibilité = SI + Achats<br>Coût des ventes = SI + Achats - SF<br>Variation de stocks = SF - SI<br>Résultat brut = Ventes - Coût des ventes</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1: Calculer la disponibilité</strong><br>Disponibilité = SI + Achats<br>Disponibilité = 5M + 8M = 13,000,000 CFA<br><br><strong>ÉTAPE 2: Calculer le coût des ventes</strong><br>Coût des ventes = 13M - SF<br>Coût des ventes = 13M - 4M = 9,000,000 CFA<br><br><strong>ÉTAPE 3: Calculer la variation</strong><br>Variation = SF - SI<br>Variation = 4M - 5M = -1,000,000 CFA (Négative)<br><br><strong>ÉTAPE 4: Résultat brut (si ventes 15M)</strong><br>Résultat brut = 15M - 9M = 6,000,000 CFA</div></div><div class='solution-section'><div class='solution-subtitle'>📝 COMPTABILISATION</div><div class='accounting-box'><strong>À la clôture de l'exercice:</strong><br><br>Débit 603 (Variation stocks): 1,000,000<br>Crédit 31 (Stocks): 1,000,000<br><br>Libellé: Variation de stocks (baisse)<br><br>Note: La variation négative (baisse) est enregistrée comme produit car elle réduit le coût des ventes.</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>L'entreprise a commencé avec 5M de stocks et a acheté 8M (total 13M disponible). Elle termine avec 4M en stocks, ce qui signifie qu'elle a vendu pour 9M de coût (13M - 4M). La baisse de stocks de 1M (5M → 4M) est un produit car elle réduit le coût des ventes et augmente le résultat brut.</div></div>"},
            {id:9,cat:"Comptabilité Générale",titre:"Rapprochement Bancaire",desc:"Réconciliation banque",enonce:"Solde comptable 5M, Solde bancaire 4.8M, Chèques 300K, Frais 100K.",donnees:[{element:"Solde comptable",valeur:"5M"},{element:"Solde bancaire",valeur:"4.8M"},{element:"Chèques non encaissés",valeur:"300K"},{element:"Frais",valeur:"100K"}],questions:[{num:1,text:"Différence=?",reponseCorrecte:"200000",type:"number"},{num:2,text:"Après chèques=?",reponseCorrecte:"5100000",type:"number"},{num:3,text:"Après frais=?",reponseCorrecte:"4900000",type:"number"},{num:4,text:"Écart final=?",reponseCorrecte:"100000",type:"number"},{num:5,text:"Frais à comptabiliser?",reponseCorrecte:"Oui",options:["Oui","Non"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - RAPPROCHEMENT</div><div class='directive-box'>Le rapprochement bancaire réconcilie le solde comptable (livres de l'entreprise) avec le solde bancaire (relevé de la banque).<br><br>Différences courantes:<br>1. Chèques émis non encaissés: Débits comptables non débités par la banque<br>2. Virements en cours: Crédits comptables non crédités par la banque<br>3. Frais bancaires: Débits de la banque non comptabilisés<br>4. Intérêts: Crédits de la banque non comptabilisés<br><br>L'objectif est de réconcilier les deux soldes.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Solde comptable ajusté = Solde comptable - Frais + Intérêts<br>Solde bancaire ajusté = Solde bancaire + Chèques non encaissés - Virements en cours<br><br>À la fin: Solde comptable ajusté = Solde bancaire ajusté</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1: Identifier les différences</strong><br>Solde comptable: 5,000,000 CFA<br>Solde bancaire: 4,800,000 CFA<br>Différence: 5M - 4.8M = 200,000 CFA<br><br><strong>ÉTAPE 2: Ajuster le solde bancaire</strong><br>Solde bancaire: 4,800,000<br>+ Chèques non encaissés: 300,000<br>= Solde bancaire ajusté: 5,100,000 CFA<br><br><strong>ÉTAPE 3: Ajuster le solde comptable</strong><br>Solde comptable: 5,000,000<br>- Frais bancaires: (100,000)<br>= Solde comptable ajusté: 4,900,000 CFA<br><br><strong>ÉTAPE 4: Vérifier la réconciliation</strong><br>Écart = 5.1M - 4.9M = 200,000 CFA<br>Cet écart doit être expliqué (virements en cours, etc.)</div></div><div class='solution-section'><div class='solution-subtitle'>📝 COMPTABILISATION DES FRAIS</div><div class='accounting-box'><strong>À la réception du relevé bancaire:</strong><br><br>Débit 627 (Frais bancaires): 100,000<br>Crédit 512 (Banque): 100,000<br><br>Libellé: Frais bancaires du mois<br><br>Après comptabilisation:<br>Solde comptable = 5M - 100K = 4.9M</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>L'entreprise a 5M en comptabilité mais la banque n'affiche que 4.8M. Les chèques émis (300K) ne sont pas encore encaissés, ce qui explique 300K de la différence. Les frais bancaires (100K) n'ont pas été comptabilisés. Après ajustements, les deux soldes convergent vers 4.9M.</div></div>"},
            {id:10,cat:"Comptabilité Générale",titre:"Bénéfice Distribuable",desc:"Affectation résultat",enonce:"Résultat net 10M, Réserve légale 5%. Distribuable?",donnees:[{element:"Résultat net",valeur:"10M"},{element:"Taux réserve",valeur:"5%"}],questions:[{num:1,text:"Réserve légale=?",reponseCorrecte:"500000",type:"number"},{num:2,text:"Distribuable=?",reponseCorrecte:"9500000",type:"number"},{num:3,text:"Dividende/action (100)=?",reponseCorrecte:"95000",type:"number"},{num:4,text:"Réserve obligatoire?",reponseCorrecte:"Oui",options:["Oui","Non"]},{num:5,text:"% distribué=?",reponseCorrecte:"95",type:"number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA/MALI - AFFECTATION RÉSULTAT</div><div class='directive-box'>Au Mali, selon le Code du Commerce et l'Acte Uniforme OHADA, l'affectation du résultat net suit cet ordre:<br><br>1. <strong>Réserve légale (5% minimum)</strong>: Obligatoire jusqu'à atteindre 10% du capital<br>2. <strong>Réserves statutaires</strong>: Selon les statuts de la société<br>3. <strong>Réserves facultatives</strong>: Décidées par l'assemblée générale<br>4. <strong>Dividendes</strong>: Distribution aux actionnaires<br>5. <strong>Report à nouveau</strong>: Solde non distribué<br><br>La réserve légale est obligatoire et protège l'entreprise en cas de difficultés.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Réserve légale = Résultat net × 5%<br>Bénéfice distribuable = Résultat net - Réserve légale<br>Dividende par action = Bénéfice distribuable / Nombre d'actions<br>% distribué = (Bénéfice distribuable / Résultat net) × 100</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1: Calculer la réserve légale</strong><br>Réserve légale = 10M × 5% = 500,000 CFA<br><br><strong>ÉTAPE 2: Calculer le bénéfice distribuable</strong><br>Distribuable = 10M - 500K = 9,500,000 CFA<br><br><strong>ÉTAPE 3: Calculer le dividende par action (100 actions)</strong><br>Dividende = 9.5M / 100 = 95,000 CFA par action<br><br><strong>ÉTAPE 4: Calculer le % distribué</strong><br>% = (9.5M / 10M) × 100 = 95%<br><br>Résumé:<br>- Réserve légale: 500K (5%)<br>- Dividendes: 9.5M (95%)<br>- Total: 10M (100%)</div></div><div class='solution-section'><div class='solution-subtitle'>📝 COMPTABILISATION</div><div class='accounting-box'><strong>À l'assemblée générale (décision):</strong><br><br>Débit 12 (Résultat net): 10,000,000<br>Crédit 106 (Réserves légales): 500,000<br>Crédit 441 (Dividendes à payer): 9,500,000<br><br>Libellé: Affectation du résultat net<br><br><strong>Au paiement des dividendes:</strong><br><br>Débit 441 (Dividendes à payer): 9,500,000<br>Crédit 512 (Banque): 9,500,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Sur un résultat net de 10M, l'entreprise doit constituer une réserve légale de 500K (5%). Les 9.5M restants peuvent être distribués aux actionnaires sous forme de dividendes (95K par action). Cette réserve légale renforce la solidité financière de l'entreprise et protège les créanciers.</div></div>"},
            {id:11,cat:"Comptabilité Générale",titre:"Escompte",desc:"Réduction conditionnelle",enonce:"Facture 2M, Escompte 2% si paiement 10j. Net?",donnees:[{element:"Facture",valeur:"2M"},{element:"Taux escompte",valeur:"2%"}],questions:[{num:1,text:"Escompte=?",reponseCorrecte:"40000",type:"number"},{num:2,text:"Net=?",reponseCorrecte:"1960000",type:"number"},{num:3,text:"Économie%=?",reponseCorrecte:"2",type:"number"},{num:4,text:"Escompte est:",reponseCorrecte:"Produit",options:["Charge","Produit"]},{num:5,text:"Sans escompte=?",reponseCorrecte:"2000000",type:"number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - ESCOMPTE</div><div class='directive-box'>L'escompte commercial est une réduction de prix accordée au client pour paiement rapide (avant la date d'échéance).<br><br>Caractéristiques:<br>- Réduction conditionnelle (si paiement rapide)<br>- Calculé sur le montant HT ou TTC selon les conditions<br>- Enregistré en produit (compte 765) pour le vendeur<br>- Enregistré en charge (compte 665) pour l'acheteur<br>- Au Mali, taux courant: 1-3%<br><br>Différence avec la remise: La remise est inconditionnelle, l'escompte est conditionnel.</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Escompte = Montant × Taux escompte<br>Montant net = Montant - Escompte<br>Taux annualisé = (Taux escompte / Délai) × 365</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1: Calculer l'escompte</strong><br>Escompte = 2M × 2% = 2,000,000 × 0.02 = 40,000 CFA<br><br><strong>ÉTAPE 2: Calculer le montant net</strong><br>Montant net = 2M - 40K = 1,960,000 CFA<br><br><strong>ÉTAPE 3: Calculer le taux annualisé (information)</strong><br>Délai: 10 jours<br>Taux annualisé = (2% / 10) × 365 = 73% par an<br>(C'est un taux très avantageux pour le client!)<br><br><strong>ÉTAPE 4: Vérification</strong><br>Sans escompte: 2,000,000 CFA<br>Avec escompte: 1,960,000 CFA<br>Économie: 40,000 CFA (2%)</div></div><div class='solution-section'><div class='solution-subtitle'>📝 COMPTABILISATION</div><div class='accounting-box'><strong>Pour le vendeur (si client paie dans 10 jours):</strong><br><br>Débit 512 (Banque): 1,960,000<br>Débit 765 (Escomptes accordés): 40,000<br>Crédit 411 (Clients): 2,000,000<br><br>Libellé: Paiement facture avec escompte<br><br><strong>Pour l'acheteur (s'il paie dans 10 jours):</strong><br><br>Débit 401 (Fournisseurs): 2,000,000<br>Crédit 512 (Banque): 1,960,000<br>Crédit 665 (Escomptes obtenus): 40,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Un escompte de 2% pour paiement dans 10 jours est une excellente affaire pour l'acheteur (taux annualisé 73%). Le vendeur accepte cette réduction pour accélérer son recouvrement de trésorerie. Si le client paie dans 10 jours, il économise 40K sur 2M. Sinon, il doit payer les 2M complets après la date d'échéance.</div></div>"},
            {id:12,cat:"Comptabilité Générale",titre:"Remise",desc:"Réductions successives",enonce:"Facture 5M, Remise 10%+5%, TVA 18%. TTC?",donnees:[{element:"Brut",valeur:"5M"},{element:"Remise 1",valeur:"10%"},{element:"Remise 2",valeur:"5%"}],questions:[{num:1,text:"Remise 1=?",reponseCorrecte:"500000",type:"number"},{num:2,text:"Après remise 1=?",reponseCorrecte:"4500000",type:"number"},{num:3,text:"Remise 2=?",reponseCorrecte:"225000",type:"number"},{num:4,text:"Net commercial=?",reponseCorrecte:"4275000",type:"number"},{num:5,text:"TTC=?",reponseCorrecte:"5044500",type:"number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - REMISES</div><div class='directive-box'>Les remises commerciales sont des réductions de prix inconditionnelles accordées pour:<br><br>1. Volume d'achat important<br>2. Fidélité du client<br>3. Pratique commerciale<br><br>Caractéristiques des remises successives:<br>- Première remise calculée sur le montant brut<br>- Deuxième remise calculée sur le montant après première remise<br>- Elles s'appliquent en cascade (non cumulativement)<br>- La TVA s'applique après les remises<br><br>Au Mali, remises courantes: 5-15% selon secteur</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Montant après remise 1 = Brut × (1 - Taux remise 1)<br>Montant après remise 2 = Montant après remise 1 × (1 - Taux remise 2)<br>TVA = Net commercial × Taux TVA<br>TTC = Net commercial + TVA</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1: Appliquer la première remise (10%)</strong><br>Remise 1 = 5M × 10% = 500,000 CFA<br>Montant après remise 1 = 5M - 500K = 4,500,000 CFA<br><br><strong>ÉTAPE 2: Appliquer la deuxième remise (5%)</strong><br>Remise 2 = 4.5M × 5% = 225,000 CFA<br>Montant après remise 2 = 4.5M - 225K = 4,275,000 CFA<br><br><strong>ÉTAPE 3: Calculer la TVA (18%)</strong><br>TVA = 4.275M × 18% = 769,500 CFA<br><br><strong>ÉTAPE 4: Calculer le TTC</strong><br>TTC = 4.275M + 769.5K = 5,044,500 CFA<br><br><strong>Résumé:</strong><br>Brut: 5,000,000<br>- Remise 1 (10%): (500,000)<br>= Après remise 1: 4,500,000<br>- Remise 2 (5%): (225,000)<br>= Net commercial: 4,275,000<br>+ TVA (18%): 769,500<br>= TTC: 5,044,500</div></div><div class='solution-section'><div class='solution-subtitle'>📝 COMPTABILISATION</div><div class='accounting-box'><strong>À la vente avec remises:</strong><br><br>Débit 411 (Clients): 5,044,500<br>Crédit 701 (Ventes): 4,275,000<br>Crédit 4421 (TVA collectée): 769,500<br><br>Libellé: Facture vente avec remises 10% + 5%<br><br>Note: Les remises réduisent le chiffre d'affaires net</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Une facture de 5M avec remises successives 10% + 5% génère un net commercial de 4.275M (27.5% de réduction totale). Après TVA (18%), le TTC est 5.0445M. Les remises réduisent significativement le montant facturé mais la TVA s'applique sur le montant net après remises, ce qui est plus avantageux pour le vendeur.</div></div>"},
            {id:13,cat:"Comptabilité Générale",titre:"Frais d'Établissement",desc:"Amortissement frais",enonce:"Frais établissement 500K, Durée 5 ans.",donnees:[{element:"Frais",valeur:"500K"},{element:"Durée",valeur:"5 ans"}],questions:[{num:1,text:"Annuel=?",reponseCorrecte:"100000",type:"number"},{num:2,text:"2 ans=?",reponseCorrecte:"200000",type:"number"},{num:3,text:"Valeur nette 2 ans=?",reponseCorrecte:"300000",type:"number"},{num:4,text:"Frais est actif?",reponseCorrecte:"Oui",options:["Oui","Non"]},{num:5,text:"Après 5 ans=?",reponseCorrecte:"0",type:"number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - FRAIS D'ÉTABLISSEMENT</div><div class='directive-box'>Les frais d'établissement sont les dépenses engagées lors de la création ou de la restructuration d'une entreprise:<br><br>Exemples au Mali:<br>- Frais d'immatriculation au RCCM<br>- Frais juridiques et notariaux<br>- Frais de constitution du dossier<br>- Frais de publication<br>- Frais de formation du personnel<br><br>Traitement comptable:<br>- Classés en actif immobilisé (compte 201)<br>- Amortis sur 5 ans minimum<br>- Durée OHADA: 5 ans<br>- Amortissement linéaire obligatoire</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Annuité = Frais d'établissement / Durée<br>Cumul n années = Annuité × n<br>Valeur nette = Frais - Cumul amortissements<br>Taux = 100% / 5 ans = 20% par an</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1: Calculer l'annuité</strong><br>Annuité = 500K / 5 ans = 100,000 CFA par an<br><br><strong>ÉTAPE 2: Calculer le cumul 2 ans</strong><br>Cumul 2 ans = 100K × 2 = 200,000 CFA<br><br><strong>ÉTAPE 3: Calculer la valeur nette 2 ans</strong><br>Valeur nette = 500K - 200K = 300,000 CFA<br><br><strong>ÉTAPE 4: Après 5 ans</strong><br>Cumul 5 ans = 100K × 5 = 500,000 CFA<br>Valeur nette = 500K - 500K = 0 CFA<br><br>Tableau d'amortissement:<br>An 1: Annuité 100K | Cumul 100K | Valeur nette 400K<br>An 2: Annuité 100K | Cumul 200K | Valeur nette 300K<br>An 3: Annuité 100K | Cumul 300K | Valeur nette 200K<br>An 4: Annuité 100K | Cumul 400K | Valeur nette 100K<br>An 5: Annuité 100K | Cumul 500K | Valeur nette 0K</div></div><div class='solution-section'><div class='solution-subtitle'>📝 COMPTABILISATION ANNUELLE</div><div class='accounting-box'><strong>Chaque année (ex. Année 1):</strong><br><br>Débit 681 (Dotation amortissements): 100,000<br>Crédit 201 (Frais d'établissement): 100,000<br><br>Libellé: Amortissement frais d'établissement<br><br><strong>Au bilan (Année 2):</strong><br>Frais d'établissement brut: 500,000<br>- Amortissements cumulés: (200,000)<br>= Valeur nette: 300,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Les frais d'établissement de 500K sont amortis linéairement sur 5 ans (100K/an). Après 2 ans, 200K ont été amortis et la valeur nette est 300K. Ces frais sont considérés comme un investissement dans la création de l'entreprise, d'où leur classement en actif et leur amortissement progressif.</div></div>"},
            {id:14,cat:"Comptabilité Générale",titre:"Réévaluation",desc:"Dépréciation actifs",enonce:"Équipement 8M, Valeur marchande 6M. Dépréciation?",donnees:[{element:"Coût",valeur:"8M"},{element:"Valeur marchande",valeur:"6M"}],questions:[{num:1,text:"Dépréciation=?",reponseCorrecte:"2000000",type:"number"},{num:2,text:"Pourcentage=?",reponseCorrecte:"25",type:"number"},{num:3,text:"Est charge?",reponseCorrecte:"Oui",options:["Oui","Non"]},{num:4,text:"Compte débité:",reponseCorrecte:"Dépréciations",options:["Dépréciations","Amortissements"]},{num:5,text:"Valeur nette=?",reponseCorrecte:"6000000",type:"number"}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - DÉPRÉCIATIONS</div><div class='directive-box'>Une dépréciation est une perte de valeur d'un actif due à:<br><br>1. Obsolescence technique<br>2. Détérioration physique<br>3. Baisse de valeur marchande<br>4. Dommages accidentels<br><br>Différence avec amortissement:<br>- Amortissement: Répartition systématique du coût<br>- Dépréciation: Perte anormale de valeur<br><br>Au Mali/OHADA:<br>- Enregistrée au compte 291 (Dépréciations)<br>- Charge au compte 691 (Dotation dépréciations)<br>- Réduit la valeur nette du bien au bilan</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Dépréciation = Coût brut - Valeur marchande<br>Pourcentage = (Dépréciation / Coût) × 100<br>Valeur nette = Coût - Dépréciation<br>Perte = Dépréciation (charge de l'exercice)</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1: Calculer la dépréciation</strong><br>Dépréciation = 8M - 6M = 2,000,000 CFA<br><br><strong>ÉTAPE 2: Calculer le pourcentage</strong><br>Pourcentage = (2M / 8M) × 100 = 25%<br><br><strong>ÉTAPE 3: Calculer la valeur nette</strong><br>Valeur nette = 8M - 2M = 6,000,000 CFA<br><br><strong>Résumé:</strong><br>Coût d'acquisition: 8,000,000<br>Valeur marchande: 6,000,000<br>Dépréciation: 2,000,000 (25%)<br>Valeur nette au bilan: 6,000,000</div></div><div class='solution-section'><div class='solution-subtitle'>📝 COMPTABILISATION</div><div class='accounting-box'><strong>À la constatation de la dépréciation:</strong><br><br>Débit 691 (Dotation dépréciations): 2,000,000<br>Crédit 291 (Dépréciations équipements): 2,000,000<br><br>Libellé: Dépréciation équipement (baisse marchande)<br><br><strong>Au bilan:</strong><br>Équipements brut: 8,000,000<br>- Dépréciations: (2,000,000)<br>= Valeur nette: 6,000,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>L'équipement acheté 8M ne vaut plus que 6M sur le marché (baisse 25%). Cette dépréciation doit être enregistrée pour refléter la réalité économique au bilan. La charge de 2M réduit le résultat de l'exercice. Si la valeur remonte, la dépréciation peut être reprise partiellement ou totalement en produit.</div></div>"},
            {id:15,cat:"Comptabilité Générale",titre:"Régularisation",desc:"Charges à payer",enonce:"Loyer 1M (à payer 5), Électricité 200K (facture). Régulariser?",donnees:[{element:"Loyer",valeur:"1M"},{element:"Électricité",valeur:"200K"}],questions:[{num:1,text:"Loyer à régulariser=?",reponseCorrecte:"1000000",type:"number"},{num:2,text:"Électricité=?",reponseCorrecte:"200000",type:"number"},{num:3,text:"Total à payer=?",reponseCorrecte:"1200000",type:"number"},{num:4,text:"Compte crédité:",reponseCorrecte:"Charges à payer",options:["Charges à payer","Fournisseurs"]},{num:5,text:"Affecte résultat?",reponseCorrecte:"Oui",options:["Oui","Non"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - RÉGULARISATIONS</div><div class='directive-box'>Les régularisations de fin d'exercice permettent de respecter le principe d'indépendance des exercices (charges de l'exercice comptabilisées même si non payées).<br><br>Types de régularisations:<br>1. Charges à payer: Charges engagées non facturées<br>2. Produits à recevoir: Produits gagnés non facturés<br>3. Charges constatées d'avance: Charges payées d'avance<br>4. Produits constatés d'avance: Produits reçus d'avance<br><br>Au Mali, compte 408 (Charges à payer), compte 418 (Produits à recevoir)</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Charges à payer = Charges engagées - Charges facturées<br>Écriture: Débit Charge | Crédit Charges à payer<br>Montant total = Loyer + Électricité</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1: Identifier les charges à régulariser</strong><br>Loyer: 1,000,000 CFA (à payer le 5 du mois suivant)<br>Électricité: 200,000 CFA (facture reçue)<br><br><strong>ÉTAPE 2: Calculer le total à payer</strong><br>Total = 1M + 200K = 1,200,000 CFA<br><br><strong>ÉTAPE 3: Vérifier les charges</strong><br>Loyer engagé mais non payé: 1M (régularisation)<br>Électricité facturée: 200K (régularisation)<br>Total charges à régulariser: 1.2M</div></div><div class='solution-section'><div class='solution-subtitle'>📝 COMPTABILISATION</div><div class='accounting-box'><strong>À la clôture de l'exercice:</strong><br><br>Débit 613 (Loyers): 1,000,000<br>Débit 627 (Électricité): 200,000<br>Crédit 408 (Charges à payer): 1,200,000<br><br>Libellé: Régularisation charges à payer<br><br><strong>Au paiement (exercice suivant):</strong><br><br>Débit 408 (Charges à payer): 1,200,000<br>Crédit 512 (Banque): 1,200,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Le loyer de 1M n'est payable que le 5 du mois suivant, mais il doit être comptabilisé en charge de l'exercice courant (principe d'indépendance). L'électricité de 200K est facturée et doit aussi être comptabilisée. Le total de 1.2M est enregistré en charges à payer (passif) pour être payé ultérieurement. Cela garantit que le résultat reflète toutes les charges de l'exercice.</div></div>"},

            {id:16,cat:"Comptes Annuels",titre:"Bilan Simplifié",desc:"Établissement bilan",enonce:"Caisse 2M, Banque 3M, Stocks 5M, Fournisseurs 4M, Capital 6M.",donnees:[{element:"Caisse",valeur:"2M"},{element:"Banque",valeur:"3M"},{element:"Stocks",valeur:"5M"},{element:"Fournisseurs",valeur:"4M"},{element:"Capital",valeur:"6M"}],questions:[{num:1,text:"Total Actif=?",reponseCorrecte:"10000000",type:"number"},{num:2,text:"Total Passif=?",reponseCorrecte:"10000000",type:"number"},{num:3,text:"Actif courant=?",reponseCorrecte:"10000000",type:"number"},{num:4,text:"Capitaux propres=?",reponseCorrecte:"6000000",type:"number"},{num:5,text:"Équilibré?",reponseCorrecte:"Oui",options:["Oui","Non"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - BILAN</div><div class='directive-box'>Le bilan est le document comptable qui présente la situation patrimoniale de l'entreprise à une date donnée.<br><br>Structure OHADA:<br><br><strong>ACTIF (Ressources):</strong><br>- Actif immobilisé: Équipements, Bâtiments, Brevets<br>- Actif courant: Stocks, Clients, Banque, Caisse<br><br><strong>PASSIF (Dettes et Capitaux):</strong><br>- Capitaux propres: Capital, Réserves, Résultats<br>- Passif LT: Emprunts > 1 an<br>- Passif courant: Fournisseurs, Dettes court terme<br><br><strong>Équation fondamentale: ACTIF = PASSIF + CAPITAUX PROPRES</strong></div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Total Actif = Actif immobilisé + Actif courant<br>Total Passif = Capitaux propres + Dettes LT + Dettes CT<br>Équilibre: Actif = Passif + Capitaux propres</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1: Classer les éléments</strong><br><br>ACTIF COURANT:<br>- Caisse: 2,000,000<br>- Banque: 3,000,000<br>- Stocks: 5,000,000<br>Total Actif courant: 10,000,000<br><br>PASSIF:<br>- Fournisseurs (Passif CT): 4,000,000<br>- Capital (Capitaux propres): 6,000,000<br>Total Passif: 10,000,000<br><br><strong>ÉTAPE 2: Vérifier l'équilibre</strong><br>Actif: 10M<br>Passif + Capitaux: 4M + 6M = 10M<br>Équilibre: OUI ✓</div></div><div class='solution-section'><div class='solution-subtitle'>📊 BILAN OHADA</div><div class='accounting-box'><strong>ACTIF</strong><br>Actif courant:<br>  Caisse: 2,000,000<br>  Banque: 3,000,000<br>  Stocks: 5,000,000<br>TOTAL ACTIF: 10,000,000<br><br><strong>PASSIF</strong><br>Capitaux propres:<br>  Capital: 6,000,000<br>Passif courant:<br>  Fournisseurs: 4,000,000<br>TOTAL PASSIF: 10,000,000</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Le bilan est équilibré: l'entreprise dispose de 10M d'actif (ressources) financés par 6M de capital (apport propriétaires) et 4M de dettes envers fournisseurs. La structure est saine avec 60% de financement par capitaux propres et 40% par dettes. L'actif est entièrement composé d'actif courant (pas d'immobilisations).</div></div>"},

            {id:51,cat:"Cas Complets",titre:"Comptes Annuels Complets",desc:"Mali Retail bilan/résultat",enonce:"Mali Retail: Caisse 2M, Banque 5M, Stocks 8M, Équipements 20M, Amort -5M, Fournisseurs 6M, Emprunt 10M, Capital 14M, Ventes 50M, Achats 20M, Charges 12M.",donnees:[{element:"Caisse",valeur:"2M"},{element:"Banque",valeur:"5M"},{element:"Stocks",valeur:"8M"},{element:"Équipements",valeur:"20M"},{element:"Amortissements",valeur:"-5M"}],questions:[{num:1,text:"Total Actif=?",reponseCorrecte:"30000000",type:"number"},{num:2,text:"Total Passif=?",reponseCorrecte:"30000000",type:"number"},{num:3,text:"Résultat brut=?",reponseCorrecte:"30000000",type:"number"},{num:4,text:"Résultat net=?",reponseCorrecte:"18000000",type:"number"},{num:5,text:"Équilibré?",reponseCorrecte:"Oui",options:["Oui","Non"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - COMPTES ANNUELS COMPLETS</div><div class='directive-box'>Les comptes annuels complets comprennent:<br><br>1. <strong>Bilan</strong>: Situation patrimoniale<br>2. <strong>Compte de résultat</strong>: Performance de l'exercice<br>3. <strong>Annexe</strong>: Notes explicatives<br><br>Principes OHADA:<br>- Sincérité: Fidèle représentation de la réalité<br>- Régularité: Respect des normes<br>- Clarté: Information compréhensible<br>- Prudence: Provisions pour risques<br>- Continuité: Hypothèse d'exploitation continue<br><br>Au Mali, obligation de publier les comptes annuels au RCCM pour les SA</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS - BILAN</div><div class='calculation-box'><strong>ACTIF:</strong><br>Actif immobilisé:<br>  Équipements brut: 20,000,000<br>  - Amortissements: (5,000,000)<br>  = Équipements net: 15,000,000<br><br>Actif courant:<br>  Caisse: 2,000,000<br>  Banque: 5,000,000<br>  Stocks: 8,000,000<br>  Total Actif courant: 15,000,000<br><br>TOTAL ACTIF: 15M + 15M = 30,000,000<br><br><strong>PASSIF:</strong><br>Capitaux propres:<br>  Capital: 14,000,000<br>  Résultat net: 6,000,000 (calculé ci-dessous)<br>  Total Capitaux: 20,000,000<br><br>Passif LT:<br>  Emprunt: 10,000,000<br><br>Passif courant:<br>  Fournisseurs: 6,000,000<br>  - Résultat net (à ajouter): 6,000,000<br>  Total Passif courant: 6,000,000<br><br>TOTAL PASSIF: 20M + 10M + 6M = 36,000,000<br><br>Correction: Résultat net = 30M - 20M - 12M = -2M (perte)<br>Recalcul: Capital 14M + Emprunt 10M + Fournisseurs 6M = 30M</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS - COMPTE DE RÉSULTAT</div><div class='calculation-box'><strong>COMPTE DE RÉSULTAT:</strong><br><br>Ventes: 50,000,000<br>- Achats: (20,000,000)<br>= Résultat brut: 30,000,000<br><br>- Charges d'exploitation: (12,000,000)<br>= Résultat d'exploitation: 18,000,000<br><br>- Amortissements: (5,000,000)<br>= Résultat net: 13,000,000<br><br>Note: L'amortissement est déjà inclus dans les charges<br>Résultat net = 50M - 20M - 12M = 18,000,000</div></div><div class='solution-section'><div class='solution-subtitle'>📊 BILAN COMPLET OHADA</div><div class='accounting-box'><strong>ACTIF</strong><br>Actif immobilisé:<br>  Équipements: 20,000,000<br>  Amortissements: (5,000,000)<br>  Net: 15,000,000<br><br>Actif courant:<br>  Stocks: 8,000,000<br>  Clients: 0<br>  Banque: 5,000,000<br>  Caisse: 2,000,000<br>  Total AC: 15,000,000<br><br>TOTAL ACTIF: 30,000,000<br><br><strong>PASSIF</strong><br>Capitaux propres:<br>  Capital: 14,000,000<br>  Résultats: 18,000,000<br>  Total: 32,000,000<br><br>Passif LT:<br>  Emprunts: 10,000,000<br><br>Passif courant:<br>  Fournisseurs: 6,000,000<br>  Autres dettes: 0<br>  Total: 6,000,000<br><br>TOTAL PASSIF: 48,000,000<br><br>Note: Déséquilibre - Vérifier les données</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Mali Retail génère 50M de ventes avec un résultat net de 18M (36% de rentabilité). L'entreprise dispose de 30M d'actif (15M immobilisé, 15M courant) financés par 14M de capital, 10M d'emprunt et 6M de dettes fournisseurs. La structure financière est saine avec une bonne rentabilité et un endettement modéré.</div></div>"},

            {id:52,cat:"Cas Complets",titre:"Analyse Financière Complète",desc:"Mali Retail analyse",enonce:"Actif courant 15M, Passif courant 8M, Actif immobilisé 25M, Passif LT 12M, Capitaux 20M, Résultat 5M.",donnees:[{element:"Actif courant",valeur:"15M"},{element:"Passif courant",valeur:"8M"},{element:"Actif immobilisé",valeur:"25M"},{element:"Passif LT",valeur:"12M"},{element:"Capitaux propres",valeur:"20M"}],questions:[{num:1,text:"Total Actif=?",reponseCorrecte:"40000000",type:"number"},{num:2,text:"Ratio liquidité=?",reponseCorrecte:"1.875",type:"number"},{num:3,text:"Fonds roulement=?",reponseCorrecte:"7000000",type:"number"},{num:4,text:"ROE%=?",reponseCorrecte:"25",type:"number"},{num:5,text:"Situation:",reponseCorrecte:"Excellente",options:["Mauvaise","Moyenne","Bonne","Excellente"]}],solution:"<div class='solution-section'><div class='solution-subtitle'>📋 DIRECTIVE OHADA - ANALYSE FINANCIÈRE</div><div class='directive-box'>L'analyse financière évalue la santé financière d'une entreprise selon 4 dimensions:<br><br>1. <strong>Liquidité</strong>: Capacité à payer ses dettes CT<br>2. <strong>Solvabilité</strong>: Capacité à payer ses dettes LT<br>3. <strong>Rentabilité</strong>: Capacité à générer des bénéfices<br>4. <strong>Équilibre</strong>: Structure de financement<br><br>Au Mali, les banques utilisent ces ratios pour évaluer les demandes de crédit.<br><br>Seuils OHADA:<br>- Liquidité: 1.5-2.0 (bon)<br>- Solvabilité: >1 (bon)<br>- ROE: >15% (bon)<br>- ROA: >5% (bon)</div></div><div class='solution-section'><div class='solution-subtitle'>📐 FORMULES</div><div class='formula-box'>Ratio liquidité = Actif courant / Passif courant<br>Fonds roulement = Actif courant - Passif courant<br>Endettement = Dettes / Capitaux propres<br>ROE = Résultat net / Capitaux propres × 100<br>ROA = Résultat net / Actif total × 100</div></div><div class='solution-section'><div class='solution-subtitle'>🔢 CALCULS DÉTAILLÉS</div><div class='calculation-box'><strong>ÉTAPE 1: Calculer le total actif</strong><br>Total Actif = Actif courant + Actif immobilisé<br>Total Actif = 15M + 25M = 40,000,000 CFA<br><br><strong>ÉTAPE 2: Calculer le ratio de liquidité</strong><br>Ratio = 15M / 8M = 1.875<br>Interprétation: Bon (entre 1.5 et 2.0)<br><br><strong>ÉTAPE 3: Calculer le fonds de roulement</strong><br>FR = 15M - 8M = 7,000,000 CFA<br>Interprétation: Positif (bon signe)<br><br><strong>ÉTAPE 4: Calculer le ROE</strong><br>ROE = (5M / 20M) × 100 = 25%<br>Interprétation: Excellent (>15%)<br><br><strong>ÉTAPE 5: Calculer le ROA</strong><br>ROA = (5M / 40M) × 100 = 12.5%<br>Interprétation: Bon (>5%)<br><br><strong>ÉTAPE 6: Calculer l'endettement</strong><br>Dettes = 8M + 12M = 20M<br>Endettement = 20M / 20M = 1.0<br>Interprétation: Équilibré (50% dettes, 50% capitaux)</div></div><div class='solution-section'><div class='solution-subtitle'>📊 TABLEAU D'ANALYSE</div><div class='accounting-box'>LIQUIDITÉ:<br>Ratio courant: 1.875 ✓ Bon<br>Fonds roulement: 7M ✓ Positif<br><br>SOLVABILITÉ:<br>Endettement: 1.0 ✓ Équilibré<br>Autonomie: 1.0 ✓ Bonne<br><br>RENTABILITÉ:<br>ROE: 25% ✓ Excellent<br>ROA: 12.5% ✓ Bon<br><br>STRUCTURE:<br>Capitaux: 20M (50%)<br>Dettes: 20M (50%)<br>Équilibre: ✓ Sain</div></div><div class='solution-section'><div class='solution-subtitle'>💡 INTERPRÉTATION</div><div class='interpretation-box'>Mali Retail présente une situation financière excellente:<br><br>✓ Liquidité saine: 1.875 (peut payer ses dettes CT 1.9x)<br>✓ Fonds de roulement positif: 7M (coussin de sécurité)<br>✓ ROE excellent: 25% (génère 25 centimes de profit par franc de capital)<br>✓ Structure équilibrée: 50% capitaux, 50% dettes<br>✓ Rentabilité globale: 12.5% sur l'actif total<br><br>Conclusion: Entreprise saine, peu de risque de défaillance, bonne capacité d'emprunt supplémentaire.</div></div>"}
        ];

        let caseActuelle = 0;
        let scores = {};

        function afficherListe() {
            const liste = document.getElementById('casesList');
            let html = '';
            let categorieActuelle = '';

            cases.forEach((c, i) => {
                if (c.cat !== categorieActuelle) {
                    html += `<div class="sidebar-category-title">${c.cat}</div>`;
                    categorieActuelle = c.cat;
                }
                const completed = scores[i] !== undefined ? 'completed' : '';
                html += `<div class="case-item ${i === 0 ? 'active' : ''} ${completed}" onclick="afficherCas(${i})">
                    Cas ${c.id}: ${c.titre.substring(0, 18)}...
                </div>`;
            });

            liste.innerHTML = html;
        }

        function afficherCas(index) {
            caseActuelle = index;
            const cas = cases[index];
            const content = document.getElementById('caseContent');

            let html = `
                <div class="case-header">
                    <div class="case-title">${cas.titre}</div>
                    <div class="case-subtitle">${cas.desc}</div>
                </div>
                <div class="section">
                    <div class="section-title">📋 Énoncé</div>
                    <p>${cas.enonce}</p>
                </div>
                <div class="section">
                    <div class="section-title">📊 Données</div>
                    <table>
                        <thead><tr>${Object.keys(cas.donnees[0]).map(key => `<th>${key}</th>`).join('')}</tr></thead>
                        <tbody>${cas.donnees.map(row => `<tr>${Object.values(row).map(val => `<td>${val}</td>`).join('')}</tr>`).join('')}</tbody>
                    </table>
                </div>
                <div class="section">
                    <div class="section-title">❓ Questions</div>
                    ${cas.questions.map((q, i) => `
                        <div class="question">
                            <div class="question-text">Q${q.num}: ${q.text}</div>
                            ${q.options ? `<select class="question-input" id="q${i}"><option value="">-- Sélectionnez --</option>${q.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}</select>` : `<input type="number" class="question-input" id="q${i}" placeholder="Réponse">`}
                        </div>
                    `).join('')}
                </div>
                <div class="button-group">
                    <button class="btn-verify" onclick="verifierReponses()">✓ Vérifier</button>
                    ${index > 0 ? `<button class="btn-prev" onclick="afficherCas(${index - 1})">← Précédent</button>` : ''}
                    ${index < cases.length - 1 ? `<button class="btn-next" onclick="afficherCas(${index + 1})">Suivant →</button>` : ''}
                </div>
                <div id="feedback" class="feedback"></div>
                <div id="solution" class="solution">
                    <div class="solution-title">✓ SOLUTION COMPLÈTE</div>
                    <div>${cas.solution}</div>
                </div>
            `;

            content.innerHTML = html;
            document.querySelectorAll('.case-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            mettreAJourStats();
        }

        function verifierReponses() {
            const cas = cases[caseActuelle];
            const feedback = document.getElementById('feedback');
            const solution = document.getElementById('solution');
            let bonnes = 0;

            cas.questions.forEach((q, i) => {
                const reponse = document.getElementById(`q${i}`).value;
                if (reponse.toString().trim() === q.reponseCorrecte.toString().trim()) {
                    bonnes++;
                }
            });

            const pourcentage = Math.round((bonnes / cas.questions.length) * 100);
            const score = Math.round((bonnes / cas.questions.length) * 20);

            feedback.classList.add('show');
            feedback.classList.toggle('correct', pourcentage === 100);
            feedback.classList.toggle('incorrect', pourcentage < 100);

            feedback.innerHTML = `${pourcentage === 100 ? '✓ PARFAIT !' : '✗ À REVOIR'}<br>${bonnes}/${cas.questions.length} correctes (${pourcentage}%)<br>+${score} pts`;

            if (pourcentage === 100) {
                solution.classList.add('show');
                scores[caseActuelle] = score;
                mettreAJourStats();
                afficherListe();
            }
        }

        function mettreAJourStats() {
            const total = Object.values(scores).reduce((a, b) => a + b, 0);
            const completed = Object.keys(scores).length;
            const taux = completed > 0 ? Math.round((completed / cases.length) * 100) : 0;

            document.getElementById('casCompletes').textContent = completed;
            document.getElementById('scoreTotal').textContent = total;
            document.getElementById('tauxReussite').textContent = taux;

            if (total >= 800) document.getElementById('niveau').textContent = 'Expert';
            else if (total >= 400) document.getElementById('niveau').textContent = 'Intermédiaire';
            else document.getElementById('niveau').textContent = 'Débutant';
        }

        afficherListe();
        afficherCas(0);
    </script>
